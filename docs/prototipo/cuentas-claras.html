<title>Plataforma Virgen María</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra superior con selector de rol; contenido en columna de 1180px; vistas de celular dentro de un marco de teléfono. Tokens del sistema de diseño del proyecto (.claude/skills/sistema-diseno), marca azul y celeste del Colegio Virgen María. */
:root {
  /* Marca Colegio Virgen María: azul institucional + celeste */
  --primario: #1b4f9c;
  --primario-hover: #153f7e;
  --primario-suave: #e6f4fc;
  --primario-texto: #1b4f9c;
  --sobre-primario: #ffffff;
  --azul-profundo: #0f2c55;
  --celeste: #38aee6;
  --celeste-texto: #0a6ea8;

  --fondo: #f4f8fc;
  --superficie: #ffffff;
  --superficie-2: #eaf2fa;
  --borde: #d8e3ef;
  --texto: #0f172a;
  --texto-2: #475569;
  --texto-3: #64748b;

  --exito: #15803d;  --exito-suave: #dcfce7;
  --alerta: #a14a06; --alerta-suave: #fef3c7;
  --peligro: #b91c1c; --peligro-suave: #fee2e2;
  --info: #0369a1;   --info-suave: #e0f2fe;

  --wa-fondo: #e7ded4;
  --wa-burbuja: #ffffff;
  --marco: #1e293b;
  --velo: rgb(15 23 42 / 0.45);

  --fuente: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radio: 8px;
  --sombra: 0 1px 3px rgb(15 23 42 / 0.08);
  --sombra-alta: 0 12px 32px rgb(15 23 42 / 0.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primario: #2a64c4; --primario-hover: #1f55ad; --primario-suave: #12304a; --primario-texto: #8fd0f5; --sobre-primario: #ffffff; --azul-profundo: #0a1d3a; --celeste: #38aee6; --celeste-texto: #8fd0f5;
    --fondo: #0b1626; --superficie: #111e33; --superficie-2: #172840; --borde: #233a5a;
    --texto: #e6ecf5; --texto-2: #a9b6ca; --texto-3: #8796ad;
    --exito: #4ade80; --exito-suave: #0f2e1d; --alerta: #fbbf24; --alerta-suave: #33250a;
    --peligro: #f87171; --peligro-suave: #3a1515; --info: #38bdf8; --info-suave: #0c2a3e;
    --wa-fondo: #0d1a17; --wa-burbuja: #1f2c33; --marco: #000000; --velo: rgb(0 0 0 / 0.6);
    --sombra: 0 1px 3px rgb(0 0 0 / 0.4); --sombra-alta: 0 12px 32px rgb(0 0 0 / 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --primario: #2a64c4; --primario-hover: #1f55ad; --primario-suave: #12304a; --primario-texto: #8fd0f5; --sobre-primario: #ffffff; --azul-profundo: #0a1d3a; --celeste: #38aee6; --celeste-texto: #8fd0f5;
  --fondo: #0b1626; --superficie: #111e33; --superficie-2: #172840; --borde: #233a5a;
  --texto: #e6ecf5; --texto-2: #a9b6ca; --texto-3: #8796ad;
  --exito: #4ade80; --exito-suave: #0f2e1d; --alerta: #fbbf24; --alerta-suave: #33250a;
  --peligro: #f87171; --peligro-suave: #3a1515; --info: #38bdf8; --info-suave: #0c2a3e;
  --wa-fondo: #0d1a17; --wa-burbuja: #1f2c33; --marco: #000000; --velo: rgb(0 0 0 / 0.6);
  --sombra: 0 1px 3px rgb(0 0 0 / 0.4); --sombra-alta: 0 12px 32px rgb(0 0 0 / 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--fondo); color: var(--texto); font-family: var(--fuente); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { line-height: 1.25; text-wrap: balance; margin: 0; }
h1 { font-size: 1.5rem; font-weight: 700; }
h2 { font-size: 1.125rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.num, td.num, .monto { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--primario-texto); outline-offset: 2px; border-radius: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }

/* Barra superior */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--superficie); border-bottom: 1px solid var(--borde); box-shadow: inset 0 3px 0 var(--celeste); }
.topbar-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
.marca strong { font-size: 1rem; display: block; }
.marca small { color: var(--texto-3); font-size: 0.75rem; display: block; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--primario); border-bottom: 3px solid var(--celeste); display: grid; place-items: center; flex: none; }
.pill-demo { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--alerta); background: var(--alerta-suave); padding: 2px 8px; border-radius: 99px; }
.roles { display: flex; gap: 2px; background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 10px; padding: 3px; overflow-x: auto; max-width: 100%; margin-left: auto; flex: 0 1 auto; min-width: 0; }
.roles button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; font-size: 0.875rem; font-weight: 500; color: var(--texto-2); min-height: 36px; }
.roles button[aria-pressed="true"] { background: var(--superficie); color: var(--texto); box-shadow: var(--sombra); font-weight: 600; }
.acciones-top { display: flex; gap: 8px; }
@media (max-width: 900px) { .roles { order: 3; width: 100%; margin-left: 0; } .acciones-top { margin-left: auto; } }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; gap: 20px; }
.cabecera { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; justify-content: space-between; }
.cabecera p { color: var(--texto-2); }

/* Componentes */
.card { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px; min-width: 0; }
.card > * + * { margin-top: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: var(--radio); border: 1px solid transparent; font-weight: 600; font-size: 0.9375rem; cursor: pointer; text-decoration: none; }
.btn-primario { background: var(--primario); color: var(--sobre-primario); }
.btn-primario:hover { background: var(--primario-hover); }
.btn-secundario { background: var(--superficie); color: var(--texto); border-color: var(--borde); }
.btn-secundario:hover { background: var(--superficie-2); }
.btn-peligro { background: var(--peligro); color: #fff; }
.btn-texto { background: transparent; color: var(--primario-texto); padding: 0 8px; min-height: 36px; }
.btn-texto.peligro { color: var(--peligro); }
.btn-chico { min-height: 36px; padding: 0 12px; font-size: 0.875rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn-bloque { width: 100%; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.b-ok { color: var(--exito); background: var(--exito-suave); }
.b-warn { color: var(--alerta); background: var(--alerta-suave); }
.b-bad { color: var(--peligro); background: var(--peligro-suave); }
.b-info { color: var(--info); background: var(--info-suave); }
.b-neutro { color: var(--texto-2); background: var(--superficie-2); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--borde); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; font-weight: 500; color: var(--texto-2); cursor: pointer; white-space: nowrap; min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--primario-texto); border-bottom-color: var(--primario-texto); font-weight: 600; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
th { text-align: left; font-size: 0.6875rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--texto-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
th.num, td.num { text-align: right; }
tr.anulado td { color: var(--texto-3); }
tr.anulado td.monto { text-decoration: line-through; }

.nota { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radio); font-size: 0.875rem; }
.nota svg { flex: none; margin-top: 2px; }
.nota-info { background: var(--info-suave); color: var(--texto); }
.nota-info svg { color: var(--info); }
.nota-ok { background: var(--exito-suave); }
.nota-ok svg { color: var(--exito); }
.nota-warn { background: var(--alerta-suave); }
.nota-warn svg { color: var(--alerta); }
.nota-bad { background: var(--peligro-suave); }
.nota-bad svg { color: var(--peligro); }

label.campo { display: grid; gap: 6px; font-size: 0.875rem; font-weight: 600; }
.input { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--superficie); }
textarea.input { min-height: 80px; resize: vertical; }
.ayuda { font-size: 0.8125rem; color: var(--texto-3); font-weight: 400; }
.error { font-size: 0.8125rem; color: var(--peligro); font-weight: 600; }

.etiqueta { font-size: 0.6875rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto-3); font-weight: 600; }
.muted { color: var(--texto-2); }
.fila { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.entre { justify-content: space-between; }

/* Inicio: antes y ahora */
.comparativa { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 820px) { .comparativa { grid-template-columns: 1fr; } }
.proceso { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.proceso li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px dashed var(--borde); }
.proceso li:first-child { border-top: 0; }
.paso-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.75rem; font-weight: 700; }
.antes .paso-n { background: var(--peligro-suave); color: var(--peligro); }
.ahora .paso-n { background: var(--exito-suave); color: var(--exito); }
.proceso strong { display: block; font-size: 0.9375rem; }
.proceso span.riesgo { display: block; font-size: 0.8125rem; color: var(--peligro); margin-top: 2px; }
.proceso span.control { display: block; font-size: 0.8125rem; color: var(--exito); margin-top: 2px; }
.semanas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .semanas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .semanas { grid-template-columns: 1fr; } }
.semana { border-top: 3px solid var(--celeste); }
.semana ul { margin: 0; padding-left: 18px; font-size: 0.875rem; color: var(--texto-2); display: grid; gap: 4px; }
.roles-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .roles-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .roles-grid { grid-template-columns: 1fr; } }
.rol-card { display: grid; gap: 6px; align-content: start; text-align: left; cursor: pointer; }
.rol-card:hover { border-color: var(--primario-texto); }
.rol-card p { font-size: 0.875rem; color: var(--texto-2); }

/* Caja */
.grid-caja { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 880px) { .grid-caja { grid-template-columns: 1fr; } }
.lista { display: grid; gap: 2px; max-height: 460px; overflow-y: auto; margin-inline: -8px; }
.lista button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px; cursor: pointer; }
.lista button:hover { background: var(--superficie-2); }
.lista button[aria-current="true"] { background: var(--primario-suave); }
.lista small { color: var(--texto-3); grid-column: 1; }
.lista .badge { grid-row: 1 / span 2; grid-column: 2; }
.alumno-cab { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
.medios { display: flex; flex-wrap: wrap; gap: 8px; }
.medios label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--borde); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 0.875rem; font-weight: 500; min-height: 40px; }
.medios input { accent-color: var(--primario); }
.medios label:has(input:checked) { border-color: var(--primario-texto); background: var(--primario-suave); }
.medios label:has(input:disabled) { opacity: 0.45; cursor: not-allowed; }
.pie-cobro { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid var(--borde); padding-top: 12px; }
.total-grande { font-size: 1.5rem; font-weight: 700; }
.cifra { font-size: 1.75rem; font-weight: 700; }
.resumen-dia { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 600px) { .resumen-dia { grid-template-columns: 1fr; } }
.cierre-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .cierre-grid { grid-template-columns: 1fr; } }
.dif { font-size: 1.25rem; font-weight: 700; }
.dif.ok { color: var(--exito); }
.dif.bad { color: var(--peligro); }

/* Escenario de celular */
.escenario { display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); gap: 32px; align-items: start; }
.telefono { border: 10px solid var(--marco); border-radius: 40px; overflow: hidden; background: var(--fondo); width: 100%; max-width: 390px; box-shadow: var(--sombra-alta); }
.pantalla { height: 720px; overflow-y: auto; display: flex; flex-direction: column; }
.notch { height: 26px; background: var(--superficie); display: flex; justify-content: space-between; align-items: center; padding: 0 18px; font-size: 0.75rem; font-weight: 600; flex: none; }
.app-cab { background: var(--azul-profundo); color: #ffffff; padding: 14px 16px; flex: none; border-bottom: 4px solid var(--celeste); }
.app-cab small { opacity: 0.85; display: block; font-size: 0.8125rem; }
.app-cuerpo { padding: 14px; display: grid; gap: 12px; align-content: start; flex: 1; }
.app-tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--superficie); border-bottom: 1px solid var(--borde); flex: none; }
.app-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 4px; font-size: 0.8125rem; font-weight: 500; color: var(--texto-2); cursor: pointer; min-height: 44px; }
.app-tabs button[aria-selected="true"] { color: var(--primario-texto); border-bottom-color: var(--primario-texto); font-weight: 600; }
.nota-lateral { display: grid; gap: 12px; }
.nota-lateral ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--texto-2); }
@media (max-width: 760px) {
  .escenario { grid-template-columns: 1fr; gap: 16px; }
  .telefono { border-width: 1px; border-color: var(--borde); border-radius: 16px; box-shadow: none; max-width: none; }
  .pantalla { height: auto; }
  .notch { display: none; }
}
.saldo-hero { border-radius: var(--radio); padding: 16px; display: grid; gap: 4px; }
.saldo-hero.debe { background: var(--peligro-suave); }
.saldo-hero.al-dia { background: var(--exito-suave); }
.saldo-hero .cifra { font-size: 1.75rem; }
.cuota-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--borde); }
.cuota-item input { width: 20px; height: 20px; accent-color: var(--primario); }
.cuota-item small { display: block; color: var(--texto-3); font-size: 0.75rem; }
.cuota-item .der { text-align: right; display: grid; gap: 2px; justify-items: end; }
.barra-pago { position: sticky; bottom: 0; background: var(--superficie); border-top: 1px solid var(--borde); padding: 12px 14px; flex: none; }
.wa { background: var(--wa-fondo); flex: 1; padding: 14px; display: grid; gap: 10px; align-content: start; }
.wa-cab { background: #075e54; color: #fff; padding: 12px 16px; flex: none; }
.burbuja { background: var(--wa-burbuja); border-radius: 0 10px 10px 10px; padding: 8px 10px; font-size: 0.875rem; max-width: 92%; box-shadow: var(--sombra); }
.burbuja time { display: block; text-align: right; font-size: 0.6875rem; color: var(--texto-3); margin-top: 2px; }
.burbuja.nueva { outline: 2px solid var(--exito); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px; display: grid; gap: 2px; align-content: start; }
.kpi .cifra { font-size: 1.25rem; }
.kpi small { color: var(--texto-3); font-size: 0.75rem; }
.alerta-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: var(--radio); font-size: 0.875rem; }
.alerta-item.critico { background: var(--peligro-suave); }
.alerta-item.espera { background: var(--alerta-suave); }
.alerta-item.bien { background: var(--exito-suave); }
.grafico { position: relative; }
.grafico svg { width: 100%; height: auto; display: block; }
.grafico .eje { fill: var(--texto-3); font-size: 10px; font-family: var(--fuente); }
.grafico .valor { fill: var(--texto); font-size: 11px; font-weight: 600; font-family: var(--fuente); }
.grafico .grid { stroke: var(--borde); stroke-width: 1; }
.grafico .meta { stroke: var(--texto-3); stroke-width: 1; stroke-dasharray: 4 3; }
.grafico .barra { fill: var(--primario); }
.grafico .hit { fill: transparent; cursor: default; }
.grafico .hit:hover + .barra, .grafico g.activo .barra { fill: var(--primario-hover); }
.tooltip { position: absolute; pointer-events: none; background: var(--texto); color: var(--fondo); font-size: 0.75rem; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); }
details summary { cursor: pointer; color: var(--primario-texto); font-size: 0.8125rem; font-weight: 600; }

/* Dirección */
.solicitud { display: grid; gap: 8px; }
.audit-candado { display: inline-flex; align-items: center; gap: 6px; }

/* Docente */
.asis { display: inline-flex; border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; }
.asis label { display: grid; place-items: center; min-width: 44px; min-height: 40px; cursor: pointer; font-size: 0.8125rem; font-weight: 600; color: var(--texto-2); border-left: 1px solid var(--borde); }
.asis label:first-child { border-left: 0; }
.asis input { position: absolute; opacity: 0; pointer-events: none; }
.asis label:has(input:checked[value="P"]) { background: var(--exito-suave); color: var(--exito); }
.asis label:has(input:checked[value="T"]) { background: var(--alerta-suave); color: var(--alerta); }
.asis label:has(input:checked[value="F"]) { background: var(--peligro-suave); color: var(--peligro); }
.asis label:has(input:focus-visible) { outline: 2px solid var(--primario-texto); outline-offset: -2px; }
.grid-doc { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 880px) { .grid-doc { grid-template-columns: 1fr; } }

/* Modal, guía y avisos */
.velo { position: fixed; inset: 0; background: var(--velo); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--superficie); border-radius: 12px; width: 100%; max-width: 480px; max-height: calc(100% - 32px); overflow-y: auto; padding: 20px; display: grid; gap: 14px; box-shadow: var(--sombra-alta); }
.modal .acciones { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.resumen { display: grid; gap: 6px; padding: 12px; background: var(--superficie-2); border-radius: var(--radio); font-size: 0.875rem; }
.resumen div { display: flex; justify-content: space-between; gap: 12px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 0.875rem; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.checks svg { color: var(--exito); margin-top: 1px; }
.qr { width: 180px; height: 180px; margin: 0 auto; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid var(--borde); }

    aplicarPago(s, { cuotaIds: ["a3-6"], medio: "EFECTIVO", usuario: CAJERA.nombre, rol: CAJERA.rol, hora: "08:12" });

    s.solicitudes.push({
      id: "s" + s.nid++, tipo: "DESCUENTO", alumnoId: "a2", estado: "PENDIENTE", hora: "08:30",
      detalle: "Descuento por hermano: 10 % en las pensiones de octubre a diciembre", monto: 13500,
      solicitante: "Patricia Gómez", rolSol: "Administración", motivo: "La familia tiene 2 hijos matriculados. Aplica la política de descuento por hermanos."
    });
    s.auditoria.push({ hora: "08:30", usuario: "Patricia Gómez", rol: "Administración", accion: "Solicitud de descuento", detalle: "Valeria Quispe · 10 % oct–dic (S/ 135.00) · pendiente de Dirección" });
    return s;
  }

  var s;
  try { var guardado = localStorage.getItem(CLAVE); s = guardado ? JSON.parse(guardado) : null; } catch (e) { s = null; }
  if (!s || !s.cuotas) s = semilla();
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(s)); } catch (e) { /* sin almacenamiento: la demo sigue en memoria */ } }

  var ui = {
    rol: "inicio", tabCaja: "cobrar", tabPadre: "cuenta", tabDir: "aprobaciones",
    sel: "a1", busq: "", marcadas: [], medio: "EFECTIVO",
    fam: "f1", padreSel: [], verPagadas: false, modal: null, guia: false, confirmarReinicio: false,
    nuevosMensajes: {}
  };

  // ---------- Consultas ----------
  function alumno(id) { return s.alumnos.find(function (a) { return a.id === id; }); }
  function familia(id) { return s.familias.find(function (f) { return f.id === id; }); }
  function cuota(id) { return s.cuotas.find(function (c) { return c.id === id; }); }
  function cuotasDe(aid) { return s.cuotas.filter(function (c) { return c.alumnoId === aid; }); }
  function saldo(c) { return c.monto - c.descuento - c.pagado; }
  function estado(c) {
    if (saldo(c) <= 0) return "pagado";
    if (c.vence < HOY) return "vencido";
    if (c.vence <= "2026-10-31") return "porvencer";
    return "pendiente";
  }
  var EST = { pagado: ["b-ok", "Pagado"], vencido: ["b-bad", "Vencido"], porvencer: ["b-warn", "Por vencer"], pendiente: ["b-neutro", "Pendiente"] };
  function badge(est) { return '<span class="badge ' + EST[est][0] + '">' + EST[est][1] + "</span>"; }
  function vencidoDe(aid) { return cuotasDe(aid).filter(function (c) { return estado(c) === "vencido"; }).reduce(function (t, c) { return t + saldo(c); }, 0); }
  function nombreCuota(c) { return c.concepto + " · " + alumno(c.alumnoId).corto; }
  function pagosHoy() { return s.pagos.filter(function (p) { return p.fecha === HOY; }); }
  function vigente(p) { return p.estado !== "ANULADO"; }
  function efectivoEsperado() { return pagosHoy().filter(function (p) { return p.medio === "EFECTIVO" && vigente(p); }).reduce(function (t, p) { return t + p.total; }, 0); }
  function pendientes() { return s.solicitudes.filter(function (x) { return x.estado === "PENDIENTE"; }); }

  // ---------- Reglas de negocio ----------
  function audit(st, usuario, rol, accion, detalle, h) { st.auditoria.push({ hora: h || hora(), usuario: usuario, rol: rol, accion: accion, detalle: detalle }); }

  function aplicarPago(st, o) {
    var cs = o.cuotaIds.map(function (id) { return st.cuotas.find(function (c) { return c.id === id; }); });
    var montos = cs.map(function (c) { return c.monto - c.descuento - c.pagado; });
    var total = montos.reduce(function (t, m) { return t + m; }, 0);
    var al = st.alumnos.find(function (a) { return a.id === cs[0].alumnoId; });
    var h = o.hora || hora();
    var p = {
      id: "p" + st.nid++, fecha: HOY, hora: h, cuotaIds: o.cuotaIds, montos: montos, total: total,
      medio: o.medio, boleta: "B001-" + String(st.boleta++).padStart(6, "0"),
      usuario: o.usuario, rol: o.rol, estado: "VIGENTE", fam: al.fam
    };
    cs.forEach(function (c, i) { c.pagado += montos[i]; });
    st.pagos.push(p);
    var detalle = cs.map(function (c) { return c.concepto + " de " + st.alumnos.find(function (a) { return a.id === c.alumnoId; }).corto; }).join(", ");

  function solicitarAnulacion(pagoId, motivo) {
    var p = s.pagos.find(function (x) { return x.id === pagoId; });

    s.solicitudes.push({ id: "s" + s.nid++, tipo: "ANULACION", pagoId: p.id, estado: "PENDIENTE", hora: hora(), detalle: "Anular " + p.boleta + " (" + MEDIOS[p.medio] + ")", monto: p.total, solicitante: CAJERA.nombre, rolSol: CAJERA.rol, motivo: motivo });

  }

  function resolver(solId, aprobar, comentario) {
    var x = s.solicitudes.find(function (y) { return y.id === solId; });
    x.estado = aprobar ? "APROBADA" : "RECHAZADA";
    x.comentario = comentario; x.resuelto = hora();
    if (x.tipo === "ANULACION") {
      var p = s.pagos.find(function (y) { return y.id === x.pagoId; });
      if (aprobar) {
        p.estado = "ANULADO";
        p.cuotaIds.forEach(function (id, i) { cuota(id).pagado -= p.montos[i]; });
        s.mensajes.push({ fam: p.fam, hora: hora(), texto: "Colegio Virgen María: se anuló el pago " + p.boleta + " por " + fmt(p.total) + ". Motivo: " + x.motivo + ". Se emitió la nota de crédito. Si no reconoce esta anulación, comuníquese con Dirección." });

        p.estado = "VIGENTE";
      }
      audit(s, DIRECTOR.nombre, DIRECTOR.rol, aprobar ? "Anulación aprobada" : "Anulación rechazada", p.boleta + " · " + fmt(p.total) + (aprobar ? " · nota de crédito emitida" : "") + (comentario ? " · comentario: " + comentario : ""));
    } else {
      if (aprobar) {
        cuotasDe(x.alumnoId).forEach(function (c, i) { if (i >= 8 && saldo(c) > 0) c.descuento = Math.round(c.monto * 0.1); });
        var al = alumno(x.alumnoId);
        s.mensajes.push({ fam: al.fam, hora: hora(), texto: "Colegio Virgen María: se aprobó el descuento por hermano de 10 % para " + al.corto + " en las pensiones de octubre a diciembre. Su nueva pensión es " + fmt(PENSION[al.nivel] * 0.9) + "." });

    }
  }

  function cerrarCaja(contado, explicacion) {
    var esperado = efectivoEsperado();
    var dif = contado - esperado;
    s.cierre = { hora: hora(), esperado: esperado, contado: contado, dif: dif, explicacion: explicacion };

  function grafico() {
    var W = 340, H = 190, L = 30, R = 8, T = 22, B = 24, ph = H - T - B, bw = (W - L - R) / HISTORICO.length, barW = 22;
    function y(v) { return T + ph * (1 - v / 100); }
    var svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Porcentaje cobrado de lo esperado, de marzo a septiembre">';
    [0, 50, 100].forEach(function (v) { svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="eje" x="' + (L - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + "</text>"; });
    svg += '<line class="meta" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(95) + '" y2="' + y(95) + '"/><text class="eje" x="' + (W - R) + '" y="' + (y(95) - 5) + '" text-anchor="end">Meta 95 %</text>';
    HISTORICO.forEach(function (d, i) {
      var cx = L + bw * i + bw / 2, x = cx - barW / 2, top = y(d.pct), base = y(0), r = 4;
      var path = "M" + x + "," + base + " V" + (top + r) + " Q" + x + "," + top + " " + (x + r) + "," + top + " H" + (x + barW - r) + " Q" + (x + barW) + "," + top + " " + (x + barW) + "," + (top + r) + " V" + base + " Z";

  function qrSvg(semillaTxt) {
    var n = 25, h = 0, i, j, out = "";
    for (i = 0; i < semillaTxt.length; i++) h = (h * 31 + semillaTxt.charCodeAt(i)) >>> 0;
    function rnd() { h = (h * 1103515245 + 12345) >>> 0; return (h >>> 16) & 1; }
    function finder(x, y) { return '<rect x="' + x + '" y="' + y + '" width="7" height="7" fill="#000"/><rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="5" height="5" fill="#fff"/><rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3" fill="#000"/>'; }
    for (i = 0; i < n; i++) for (j = 0; j < n; j++) {
      var enFinder = (i < 8 && j < 8) || (i < 8 && j > n - 9) || (i > n - 9 && j < 8);
      if (!enFinder && rnd()) out += '<rect x="' + j + '" y="' + i + '" width="1" height="1" fill="#000"/>';
    }
    return '<svg class="qr" viewBox="0 0 ' + n + " " + n + '" shape-rendering="crispEdges" role="img" aria-label="Código QR de ejemplo">' + out + finder(0, 0) + finder(n - 7, 0) + finder(0, n - 7) + "</svg>";
  }

        break;
      }
      case "revisar": ui.modal = { tipo: "revisar", solId: v }; break;
      case "decidir": {
        var com = document.getElementById("coment").value.trim();
        resolver(ui.modal.solId, v === "si", com); ui.modal = null; guardar();
        aviso(v === "si" ? "Solicitud aprobada" : "Solicitud rechazada", "Quedó registrado en la auditoría.");
        break;
      }
      case "cerrarCaja": {
        var inp = document.getElementById("contado"), ex = document.getElementById("expl").value.trim(), err = document.getElementById("err-cierre");
        if (inp.value === "" || isNaN(parseFloat(inp.value))) { err.textContent = "Escribe el efectivo contado."; err.hidden = false; return; }
        var contado = Math.round(parseFloat(inp.value) * 100);
        if (contado !== efectivoEsperado() && ex.length < 10) { err.textContent = "Hay una diferencia: explica qué pasó (mínimo 10 caracteres)."; err.hidden = false; return; }
        cerrarCaja(contado, ex); guardar();
        if (s.cierre.dif !== 0) aviso("Alerta enviada a la promotora", "Diferencia de " + fmt(Math.abs(s.cierre.dif)) + " en caja.", "mal");
        else aviso("Caja cerrada sin diferencia", "La promotora recibió la confirmación.");
        if (ui.medio === "EFECTIVO") ui.medio = "YAPE";
        break;
      }
      case "verPagadas": ui.verPagadas = !ui.verPagadas; break;
      case "padrePagar": ui.modal = { tipo: "padrePagar", medio: "YAPE" }; break;
      case "simularPago": {
        var pp = aplicarPago(s, { cuotaIds: ui.padreSel.slice(), medio: ui.modal.medio, usuario: "Pasarela de pagos", rol: "Automático" });
        ui.padreSel = []; ui.modal = { tipo: "padrePagar", listo: true, pagoId: pp.id }; guardar();
        aviso("WhatsApp recibido", "Boleta " + pp.boleta + " · " + fmt(pp.total), "wa");
        break;
      }
      case "guardarAsistencia": {
        var marcas = {}, avisos = 0;
        SECCION.forEach(function (n, i) { var r = document.querySelector('input[name="as-' + i + '"]:checked'); marcas[i] = r ? r.value : "P"; if (marcas[i] !== "P") avisos++; });
        s.asistencia = { hora: hora(), marcas: marcas, avisos: avisos };
        if (marcas[0] !== "P") {
          s.mensajes.push({ fam: "f1", hora: hora(), texto: "Colegio Virgen María: Mateo " + (marcas[0] === "F" ? "no asistió hoy" : "llegó tarde hoy") + " (02/10). Si tiene una justificación, puede responder a este mensaje. Prof. Ana Torres." });
          ui.nuevosMensajes.f1 = (ui.nuevosMensajes.f1 || 0) + 1;
        }
        audit(s, "Ana Torres", "Docente", "Asistencia registrada", "5.° Primaria A · " + avisos + " avisos enviados");
        guardar();
        aviso("Asistencia guardada", avisos ? "Se avisó a " + avisos + (avisos === 1 ? " familia." : " familias.") : "Todos presentes.");
        break;
      }
      case "ir": {
        var paso = pasosGuia()[+v];
        ui.rol = paso[0];
        if (paso[0] === "caja") ui.tabCaja = paso[1];
        if (paso[0] === "padre") { ui.tabPadre = paso[1]; if (paso[1] === "mensajes") ui.fam = ultimaFamiliaPagada(); else ui.fam = "f1"; }
        if (paso[0] === "director") ui.tabDir = paso[1];
        if (window.innerWidth < 900) ui.guia = false;
        window.scrollTo(0, 0);
        break;
      }
      case "reiniciar": ui.confirmarReinicio = true; break;
      case "reiniciarNo": ui.confirmarReinicio = false; break;
      case "reiniciarSi":
        s = semilla(); guardar();
        ui.confirmarReinicio = false; ui.sel = "a1"; ui.marcadas = primeraPendiente("a1"); ui.padreSel = []; ui.medio = "EFECTIVO"; ui.nuevosMensajes = {}; ui.fam = "f1";
        aviso("Demostración reiniciada", "Datos de ejemplo restaurados.");
        break;
      case "cerrarModal": ui.modal = null; break;
      default: return;
    }
    render();
  });

  document.addEventListener("change", function (ev) {
    var t = ev.target, a = t.getAttribute("data-a"), v = t.getAttribute("data-v");
    if (a === "marcar") {
      var i = ui.marcadas.indexOf(v);
      if (t.checked && i < 0) ui.marcadas.push(v);
      if (!t.checked && i >= 0) ui.marcadas.splice(i, 1);
      render(); var el = document.getElementById("c-" + v); if (el) el.focus();
    } else if (a === "padreMarcar") {
      var j = ui.padreSel.indexOf(v);
      if (t.checked && j < 0) ui.padreSel.push(v);
      if (!t.checked && j >= 0) ui.padreSel.splice(j, 1);
      var sc = document.querySelector(".pantalla"), top = sc ? sc.scrollTop : 0;
      render(); sc = document.querySelector(".pantalla"); if (sc) sc.scrollTop = top;
    } else if (a === "medio") { ui.medio = t.value; render(); }
    else if (a === "medioPadre") { ui.modal.medio = t.value; render(); }
    else if (t.id === "fam") { ui.fam = t.value; ui.padreSel = []; render(); }
  });

  document.addEventListener("input", function (ev) {
    if (ev.target.id === "busq") { ui.busq = ev.target.value; document.getElementById("lista").innerHTML = listaAlumnos(); }
    if (ev.target.id === "contado") actualizarDif();
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") {
      if (ui.modal) { ui.modal = null; render(); }
      else if (ui.guia) { ui.guia = false; render(); }
    }
  });

  // Tooltip del gráfico
  document.addEventListener("mouseover", function (ev) {
    var g = ev.target.closest && ev.target.closest("[data-bar]");
    var tip = document.getElementById("tip");
    if (!tip) return;
    document.querySelectorAll("#grafico g.activo").forEach(function (x) { x.classList.remove("activo"); });
    if (!g) { tip.hidden = true; return; }
    g.classList.add("activo");
    var d = HISTORICO[+g.getAttribute("data-bar")];
    var cont = document.getElementById("grafico").getBoundingClientRect(), b = g.querySelector(".barra").getBoundingClientRect();
    tip.innerHTML = "<strong>" + d.nombre + "</strong>: " + d.pct + " % · " + fmt(ESPERADO_MES * d.pct / 100);
    tip.style.left = (b.left + b.width / 2 - cont.left) + "px";
    tip.style.top = (b.top - cont.top - 6) + "px";
    tip.hidden = false;
  });

  function primeraPendiente(aid) {
    var c = cuotasDe(aid).find(function (x) { return saldo(x) > 0; });
    return c ? [c.id] : [];
  }
  function ultimaFamiliaPagada() {
    var ps = s.pagos.filter(function (p) { return p.rol === "Caja"; });
    return ps.length ? ps[ps.length - 1].fam : "f1";
  }

  ui.marcadas = primeraPendiente(ui.sel);
  render();
})();
</script>
