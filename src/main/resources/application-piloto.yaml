# Piloto: como producción (MySQL 8, cc_app, sin migrar al arrancar) pero con pasarela y OSE de PRUEBAS.
# La pasarela SIMULADA solo se permite aquí si el DBA registró la fila 'pasarela_simulada' en configuracion_bd
# (docs/operacion/mysql-usuarios.md). Nunca se combina con prod, dev ni test.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}
  flyway:
    enabled: false

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${CC_PROXIES_INTERNOS:10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2[0-9]|3[0-1])\.\d+\.\d+|127\.\d+\.\d+\.\d+|0:0:0:0:0:0:0:1|::1}

# Sprint 7, tanda 1: logs JSON enmascarados, como en prod (el piloto puede tener datos reales).
logging:
  structured:
    format:
      console: ecs
    json:
      customizer: pe.edu.virgenmaria.cuentasclaras.operacion.log.EnmascaradoLogs

cuentasclaras:
  # Sprint 7, tanda 1: el piloto también exige su respaldo diario (puede usar el destino simulado si el DBA lo admite).
  monitoreo:
    respaldo-exigido: true
  # Sprint 5: mensajería SIMULADA (la base debe tener la fila 'mensajeria_simulada' del DBA). Para probar con
  # WhatsApp o correo reales: proveedor real, permitir-real-fuera-de-prod y la lista de números o correos de prueba.
  mensajeria:
    whatsapp:
      proveedor: ${MENSAJERIA_WHATSAPP_PROVEEDOR:SIMULADO}
    correo:
      proveedor: ${MENSAJERIA_CORREO_PROVEEDOR:SIMULADO}
  # S4-M1: franja «PILOTO» en todas las páginas; la pasarela SIMULADA la exige. En el piloto, los pagos simulados no
  # se aplican a cuotas (quedan por revisar como «no es dinero real»).
  entorno:
    nombre: PILOTO
  inicial:
    colegio-id: ${CC_COLEGIO_ID:1}
    promotor-usuario: ${CC_PROMOTOR_USUARIO:}
    promotor-nombre: ${CC_PROMOTOR_NOMBRE:}
    promotor-clave: ${CC_PROMOTOR_CLAVE:}
