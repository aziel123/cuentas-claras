# Piloto: como producción (MySQL 8, cc_app, sin migrar al arrancar) pero con pasarela y OSE de PRUEBAS.
# La pasarela SIMULADA solo se permite aquí si el DBA registró la fila 'pasarela_simulada' en configuracion_bd
# (docs/operacion/mysql-usuarios.md). Nunca se combina con prod, dev ni test.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}
  flyway:
    enabled: false

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${CC_PROXIES_INTERNOS:10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2[0-9]|3[0-1])\.\d+\.\d+|127\.\d+\.\d+\.\d+|0:0:0:0:0:0:0:1|::1}

cuentasclaras:
  inicial:
    colegio-id: ${CC_COLEGIO_ID:1}
    promotor-usuario: ${CC_PROMOTOR_USUARIO:}
    promotor-nombre: ${CC_PROMOTOR_NOMBRE:}
    promotor-clave: ${CC_PROMOTOR_CLAVE:}
