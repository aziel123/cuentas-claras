# Producción: MySQL 8. Las credenciales llegan por variables de entorno, nunca en el código.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}
  flyway:
    validate-on-migrate: true

server:
  forward-headers-strategy: framework

# Primer PROMOTOR: se crea al arrancar SOLO si no hay ningún usuario. Debe cambiar la clave al ingresar.
cuentasclaras:
  inicial:
    colegio-id: ${CC_COLEGIO_ID:1}
    promotor-usuario: ${CC_PROMOTOR_USUARIO:}
    promotor-nombre: ${CC_PROMOTOR_NOMBRE:}
    promotor-clave: ${CC_PROMOTOR_CLAVE:}
