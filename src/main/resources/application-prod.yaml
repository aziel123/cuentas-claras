# Producción: MySQL 8. Las credenciales llegan por variables de entorno, nunca en el código.
# La aplicación usa cc_app (sin UPDATE ni DELETE sobre la bitácora) y NO migra: antes de cada despliegue se
# ejecuta «java -jar cuentas-claras.jar migrar» con cc_migrador (docs/operacion/mysql-usuarios.md).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}
  flyway:
    enabled: false

server:
  # IP real del visitante: solo se cree la cabecera X-Forwarded-For si la petición llega desde un proxy de
  # confianza (internal-proxies). Si un visitante la envía directamente, se ignora.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Expresión regular de las IP de tus proxies. Por defecto: loopback y redes privadas típicas.
      internal-proxies: ${CC_PROXIES_INTERNOS:10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2[0-9]|3[0-1])\.\d+\.\d+|127\.\d+\.\d+\.\d+|0:0:0:0:0:0:0:1|::1}

# Sprint 7, tanda 1 (sección 10.2): una línea JSON (ECS) por evento a la salida estándar; mensajes, trazas y MDC pasan
# por el enmascarado (DNI, RUC, celulares, correos, tokens y el valor de un «Duplicate entry»). El servidor los rota y
# los guarda 30 días (decisión 95).
logging:
  structured:
    format:
      console: ecs
    json:
      customizer: pe.edu.virgenmaria.cuentasclaras.operacion.log.EnmascaradoLogs

cuentasclaras:
  # Correcciones del sprint 11 (A1 y B3): obligatorios en prod, sin valor por defecto (si faltan, no arranca):
  # CC_DIR_EXPORTACIONES, donde viven los ZIP de las exportaciones (fuera de los respaldos), y CC_DIR_ACTAS, la copia local
  # de las actas de supresión del depósito con bloqueo de objetos (la sincroniza el despliegue antes de arrancar:
  # docs/operacion/fin-de-un-colegio.md). VerificadorSupresion se niega a arrancar si están vacíos.
  exportacion:
    directorio: ${CC_DIR_EXPORTACIONES}
  supresion:
    actas-dir: ${CC_DIR_ACTAS}
  # Sprint 7, tanda 1: sin respaldo en 26 h es CRÍTICA y el destino simulado no cuenta (VerificadorConfiguracion).
  monitoreo:
    respaldo-exigido: true
    aceptar-respaldo-simulado: false
  # Sprint 8, tanda 1: ya no hay primer PROMOTOR por variables (CC_PROMOTOR_*): los operadores de CC_OPERADORES dan de alta
  # cada colegio desde /plataforma, y la marca del producto (CC_MARCA_NOMBRE) es obligatoria.
