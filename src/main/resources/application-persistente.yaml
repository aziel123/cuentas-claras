# Demo local PERSISTENTE: solo junto a dev (SPRING_PROFILES_ACTIVE=dev,persistente). La misma H2 en modo MySQL de dev, pero
# en el archivo .demo-db/cuentasclaras.mv.db (relativo a la carpeta desde donde se arranca): lo que hagas en la demo
# sobrevive al reinicio. Para empezar de cero, detén la aplicación y borra la carpeta .demo-db/. VerificadorConfiguracion
# no deja combinar este perfil con prod, piloto ni demo. Sin DB_CLOSE_ON_EXIT=FALSE: al salir, H2 cierra el archivo en
# limpio (la conexión de migración, AnclaMigracionH2, lo mantiene abierto mientras viva la aplicación).
spring:
  datasource:
    url: jdbc:h2:file:./.demo-db/cuentasclaras;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
