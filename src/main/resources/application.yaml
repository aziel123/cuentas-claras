spring:
  application:
    name: cuentas-claras
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo controla Flyway (src/main/resources/db/migration). Hibernate solo valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
        # Los LocalDateTime (hora de Lima, del reloj de la aplicación) se guardan TAL CUAL en las columnas
        # DATETIME, sin convertir según la zona horaria de la JVM. Sin esto, con la JVM en UTC se guardaban
        # 5 horas corridas y la cadena HMAC de auditoría dependía de la zona del servidor.
        type:
          java_time_use_direct_jdbc: true
        # Multi-colegio (@TenantId). Se registra por NOMBRE DE CLASE para que Hibernate lo
        # use también en @DataJpaTest; registrado como bean de Spring no se aplica ahí.
        tenant_identifier_resolver: pe.edu.virgenmaria.cuentasclaras.comun.multicolegio.ResolutorColegioActual
  thymeleaf:
    cache: true
  jackson:
    time-zone: America/Lima

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: CCSESION
        http-only: true
        same-site: lax
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

cuentasclaras:
  seguridad:
    # Intentos fallidos seguidos antes de bloquear la cuenta, y cuánto dura el bloqueo.
    intentos-maximos: 5
    duracion-bloqueo: 15m
    # Una clave temporal (alta o restablecimiento) deja de servir pasado este tiempo.
    vigencia-clave-temporal: 48h
  auditoria:
    # Clave de la cadena HMAC-SHA256 de la bitácora (mínimo 32 caracteres). Sin ella la
    # aplicación no arranca. Nunca en el código: va en el gestor de secretos.
    clave-hmac: ${AUDITORIA_CLAVE_HMAC}
