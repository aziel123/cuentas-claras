spring:
  application:
    name: cuentas-claras
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo controla Flyway (src/main/resources/db/migration). Hibernate solo valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
        # Los LocalDateTime (hora de Lima, del reloj de la aplicación) se guardan TAL CUAL en las columnas
        # DATETIME, sin convertir según la zona horaria de la JVM. Sin esto, con la JVM en UTC se guardaban
        # 5 horas corridas y la cadena HMAC de auditoría dependía de la zona del servidor.
        type:
          java_time_use_direct_jdbc: true
        # Multi-colegio (@TenantId). Se registra por NOMBRE DE CLASE para que Hibernate lo
        # use también en @DataJpaTest; registrado como bean de Spring no se aplica ahí.
        tenant_identifier_resolver: pe.edu.virgenmaria.cuentasclaras.comun.multicolegio.ResolutorColegioActual
  thymeleaf:
    cache: true
  servlet:
    multipart:
      # Límite del contenedor, holgado: el de 2 MB (cuentasclaras.excel.max-bytes) lo valida la aplicación con un
      # mensaje claro. Por encima de esto el contenedor no lee el archivo (ver ManejadorAccesoDenegado).
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    format:
      # Fechas de los formularios (input type="date") en ISO: 2026-03-02. Sin esto, al volver a mostrar un formulario
      # con errores se formatearían con el estilo corto del idioma (12/1/26) y el navegador las descartaría.
      date: iso
  jackson:
    time-zone: America/Lima

server:
  tomcat:
    # Descarta (sin procesar) hasta 20 MB de un envío rechazado, para que el navegador reciba la respuesta con el
    # mensaje en vez de un corte de conexión.
    max-swallow-size: 20MB
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: CCSESION
        http-only: true
        same-site: lax
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

cuentasclaras:
  seguridad:
    # Intentos fallidos seguidos antes de bloquear la cuenta, y cuánto dura el bloqueo.
    intentos-maximos: 5
    duracion-bloqueo: 15m
    # Una clave temporal (alta o restablecimiento) deja de servir pasado este tiempo.
    vigencia-clave-temporal: 48h
  excel:
    max-bytes: 2MB            # archivo subido
    max-filas: 2000           # filas de datos
    max-descomprimido: 20MB   # suma de todas las entradas del zip
    max-entradas-zip: 200
  auditoria:
    # Clave de la cadena HMAC-SHA256 de la bitácora (mínimo 32 caracteres). Sin ella la
    # aplicación no arranca. Nunca en el código: va en el gestor de secretos.
    clave-hmac: ${AUDITORIA_CLAVE_HMAC}
