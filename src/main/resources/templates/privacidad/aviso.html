<!DOCTYPE html>
<!--/* Sprint 8, tanda 1 (decisión 125): el aviso PÚBLICO es el genérico del proveedor como encargado. No nombra a ningún
     colegio: la lista de clientes no se publica. El de cada colegio está en /familia/privacidad, con sesión. */-->
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: publica('Aviso de privacidad', ~{::main})}">
<body>
<main id="contenido" class="contenido-publico">
	<section class="tarjeta tarjeta-publica" aria-labelledby="titulo-privacidad" data-pantalla="aviso-privacidad">
		<div>
			<p class="etiqueta" th:text="${marca.nombre}">Marca</p>
			<h1 id="titulo-privacidad">Aviso de privacidad</h1>
			<p class="secundario">Versión <span th:text="${version}" data-version>2027-01</span>. Ley 29733 de Protección de
				Datos Personales y su reglamento.</p>
		</div>
		<th:block th:replace="~{privacidad/fragmentos :: textoAviso(null)}"></th:block>

		<p><a class="btn btn-secundario" th:href="@{/login}">Ir al ingreso</a></p>
	</section>
</main>
</body>
</html>
