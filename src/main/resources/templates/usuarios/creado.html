<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: pagina('Clave temporal', ~{::main})}">
<body>
<main id="contenido" class="contenido">
	<section class="tarjeta formulario-angosto" aria-labelledby="titulo-creado">
		<div>
			<p class="etiqueta">Usuarios y roles</p>
			<h1 id="titulo-creado" th:text="${restablecida} ? 'Clave restablecida' : 'Usuario creado'">Usuario creado</h1>
			<p class="secundario" th:text="|${creado.nombreCompleto} · usuario ${creado.nombreUsuario}|">Lucía Ramos · usuario lucia.ramos</p>
		</div>

		<div th:replace="~{fragments/componentes :: alerta('advertencia',
			'Entrega esta clave temporal ahora, en persona o por un medio privado: no la volverás a ver. Al ingresar, tendrá que cambiarla por una propia.')}"></div>

		<div class="clave-temporal">
			<span class="etiqueta">Clave temporal</span>
			<output class="clave-temporal-valor" th:text="${creado.claveTemporal}" aria-label="Clave temporal">abcd2345EFGH</output>
		</div>

		<div class="acciones">
			<a class="btn btn-secundario" th:href="@{/usuarios/{id}(id=${creado.id})}">Ver usuario</a>
			<a class="btn btn-primario" th:href="@{/usuarios}">Listo, ya la entregué</a>
		</div>
	</section>
</main>
</body>
</html>
