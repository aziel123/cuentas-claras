<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: publica('Ingresar', ~{::main})}">
<body>
<main id="contenido" class="contenido-publico">
	<section class="tarjeta tarjeta-publica" aria-labelledby="titulo-login">
		<div>
			<h1 id="titulo-login" th:text="|Ingresa a ${marca.nombre}|">Ingresa</h1>
			<p class="secundario">Usa el usuario y la clave que te entregó el colegio.</p>
		</div>

		<th:block th:if="${mensaje != null}">
			<div th:replace="~{fragments/componentes :: alerta(${mensaje.tipo}, ${mensaje.texto})}"></div>
		</th:block>

		<form class="formulario" th:action="@{/login}" method="post">
			<div class="campo">
				<label for="usuario">Usuario</label>
				<!--/* Sprint 8, tanda 3: en la demo, «Entrar como …» deja el usuario escrito (?usuario=...). */-->
				<input type="text" class="input" id="usuario" name="usuario" autocomplete="username"
					autocapitalize="none" spellcheck="false" maxlength="60" required autofocus
					th:value="${entornoDemo == true and param.usuario != null} ? ${param.usuario[0]} : ''">
			</div>
			<div class="campo">
				<label for="clave">Clave</label>
				<input type="password" class="input" id="clave" name="clave" autocomplete="current-password" required>
			</div>
			<button type="submit" class="btn btn-primario btn-bloque">Ingresar</button>
		</form>

		<p class="ayuda" th:if="${entornoDemo == true}" data-crear-demo>¿Todavía no tienes tu colegio de prueba?
			<a th:href="@{/demo}">Crea tu demo</a>.</p>
		<p class="ayuda">¿Olvidaste tu clave? Pide a Promotoría o Dirección que te la restablezcan.</p>
		<p class="ayuda"><a th:href="@{/privacidad}">Aviso de privacidad</a></p>
	</section>
</main>
</body>
</html>
