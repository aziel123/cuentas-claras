<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: publica('Activa tu cuenta', ~{::main})}">
<body>
<main id="contenido" class="contenido-publico">
	<section class="tarjeta tarjeta-publica" aria-labelledby="titulo-activar">
		<th:block th:if="${vista == null}">
			<h1 id="titulo-activar">Este enlace ya no sirve</h1>
			<div th:replace="~{fragments/componentes :: alerta('advertencia', 'El enlace se usó, venció o se reemplazó por otro. Si no fuiste tú quien lo usó, avisa al colegio: Promotoría puede darte un enlace nuevo.')}"></div>
			<p><a class="btn btn-secundario" th:href="@{/login}">Ir a ingresar</a></p>
		</th:block>
		<th:block th:if="${vista != null}">
			<div>
				<h1 id="titulo-activar">Activa tu cuenta</h1>
				<p class="secundario" th:text="|Hola, ${vista.nombreCompleto}. Elige tu clave: nadie más la conoce, ni el colegio.|">Hola</p>
			</div>
			<th:block th:if="${error != null}">
				<div th:replace="~{fragments/componentes :: alerta('error', ${error})}"></div>
			</th:block>
			<form class="formulario" method="post" th:action="@{/activar/{c}/{t}(c=${colegio},t=${token})}">
				<div class="campo">
					<label for="documento" th:text="${vista.personal} ? 'Tu nombre de usuario' : 'Tu número de documento'">Tu número de documento</label>
					<input type="text" class="input" id="documento" name="documento" autocomplete="username"
						maxlength="60" required autofocus>
				</div>
				<div class="campo">
					<label for="clave">Tu nueva clave</label>
					<input type="password" class="input" id="clave" name="clave" autocomplete="new-password" required
						aria-describedby="clave-ayuda">
					<p class="ayuda" id="clave-ayuda">Usa al menos 10 caracteres. Una frase es más segura y fácil de recordar.</p>
				</div>
				<div class="campo">
					<label for="confirmacion">Repite tu nueva clave</label>
					<input type="password" class="input" id="confirmacion" name="confirmacion" autocomplete="new-password" required>
				</div>
				<button type="submit" class="btn btn-primario btn-bloque">Activar mi cuenta</button>
			</form>
			<p class="ayuda">Este enlace sirve una sola vez. Si no lo pediste tú, no lo uses y avisa al colegio.</p>
		</th:block>
	</section>
</main>
</body>
</html>
