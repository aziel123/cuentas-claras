<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: pagina('Inicio', ~{::main})}">
<body>
<!--/* Rediseño (hallazgo 9): la misma estructura en todos los inicios. */-->
<main id="contenido" class="contenido" data-inicio="docente">
	<div class="cabecera">
		<div>
			<p class="etiqueta">Docente</p>
			<!--/* Sprint 11, tanda 1b (F-D7): «Cómo te cuida el sistema» pasa a un «i» junto al título. */-->
			<h1><span th:text="|Hola, ${usuarioActual.nombreCompleto}|">Hola</span>
				<span th:replace="~{fragments/componentes :: info('inicio', 'Solo ves tus secciones. Las notas nunca se bloquean por deudas de pensión.', 'cómo te cuida el sistema')}"></span></h1>
		</div>
	</div>

	<th:block th:if="${avisoClave != null}">
		<div th:replace="~{fragments/componentes :: alerta('advertencia', ${avisoClave})}"></div>
	</th:block>

	<!--/* Sprint 11, tanda 1b (sección 3.14): la guía mientras el colegio está en preparación. */-->
	<th:block th:if="${guia != null}"><section th:replace="~{fragments/guia :: bannerPreparacion(${guia}, false, false)}"></section></th:block>

	<section class="tarjeta" aria-labelledby="titulo-secciones">
		<h2 id="titulo-secciones">Tus secciones</h2>
		<ul class="lista-revisar">
			<li class="item-revisar">
				<div class="item-revisar-texto"><p>Donde eres tutor, docente o auxiliar.</p></div>
				<a class="btn btn-primario" th:href="@{/academico}">Ver mis secciones</a>
			</li>
		</ul>
	</section>

</main>
</body>
</html>
