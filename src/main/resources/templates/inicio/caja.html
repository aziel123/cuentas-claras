<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: pagina('Inicio', ~{::main})}">
<body>
<!--/* Rediseño (hallazgos 5 y 9): la cajera empieza buscando al alumno; el formulario va a la misma búsqueda de /caja. */-->
<main id="contenido" class="contenido" data-inicio="caja">
	<div class="cabecera">
		<div>
			<p class="etiqueta">Caja</p>
			<!--/* Sprint 11, tanda 1b (F-D7): «Cómo te cuida el sistema» pasa a un «i» junto al título. */-->
			<h1><span th:text="|Hola, ${usuarioActual.nombreCompleto}|">Hola</span>
				<span th:replace="~{fragments/componentes :: info('inicio', 'Cada pago emite su boleta al momento. Si te equivocas, pides la anulación: nadie borra pagos. Cierras a ciegas: cuentas el efectivo sin ver lo registrado.', 'cómo te cuida el sistema')}"></span></h1>
		</div>
		<div class="fila">
			<a th:replace="~{fragments/componentes :: enlaceBoton('Pagos de hoy', @{/caja/hoy}, 'secundario')}"></a>
			<a th:replace="~{fragments/componentes :: enlaceBoton('Cerrar mi caja', @{/caja/cierre}, 'secundario')}"></a>
		</div>
	</div>

	<th:block th:if="${avisoClave != null}">
		<div th:replace="~{fragments/componentes :: alerta('advertencia', ${avisoClave})}"></div>
	</th:block>

	<!--/* Sprint 11, tanda 1b (sección 3.14): la guía mientras el colegio está en preparación. */-->
	<section th:if="${guia != null}" th:replace="~{fragments/guia :: bannerPreparacion(${guia}, false, false)}"></section>

	<section class="tarjeta cobro-rapido" aria-labelledby="titulo-cobrar">
		<h2 id="titulo-cobrar">Cobrar</h2>
		<form class="buscador" method="get" th:action="@{/caja}" role="search">
			<div class="campo">
				<label for="q">Buscar alumno o apoderado. Por nombre o DNI</label>
				<input class="input input-grande" type="search" id="q" name="q" autocomplete="off" autofocus maxlength="80"
					minlength="2" required aria-describedby="q-ayuda">
				<p class="ayuda" id="q-ayuda">Por ejemplo: «quispe» o «7845». Escribe al menos 2 letras o números.</p>
			</div>
			<button type="submit" class="btn btn-primario btn-grande">Buscar</button>
		</form>
	</section>

</main>
</body>
</html>
