<!DOCTYPE html>
<!--/* Sprint 9, tanda 3 (sección 3.10): los comunicados de la familia. Igual para todas, con deuda o sin ella (E39). */-->
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: pagina('Comunicados', ~{::main})}">
<body>
<main id="contenido" class="contenido" data-pantalla="familia-comunicados">
	<div class="cabecera">
		<div>
			<p class="etiqueta"><a th:href="@{/familia}">Mi familia</a></p>
			<h1>Comunicados</h1>
			<p class="secundario">Del colegio y de los docentes de tus hijos. Si te piden confirmar, hazlo aquí.</p>
		</div>
	</div>

	<th:block th:replace="~{fragments/componentes :: avisos}"></th:block>

	<th:block th:if="${#lists.isEmpty(comunicados)}">
		<div th:replace="~{fragments/componentes :: estadoVacio('No tienes comunicados', 'Cuando el colegio envíe uno a la sección de tus hijos, aparecerá aquí.')}"></div>
	</th:block>

	<ul class="lista-simple" th:unless="${#lists.isEmpty(comunicados)}">
		<li th:each="c : ${comunicados}" class="fila entre">
			<span>
				<a th:href="@{/familia/comunicados/{id}(id=${c.id()})}" th:text="${c.titulo()}">Título</a>
				<span class="secundario" th:text="|${c.emisor()} · ${#temporals.format(c.enviadoEn(), 'dd/MM/yyyy')}|">De</span>
			</span>
			<span>
				<th:block th:if="${c.nuevo()}"><span th:replace="~{fragments/componentes :: badge('Nuevo', 'info')}"></span></th:block>
				<th:block th:if="${c.urgente()}"><span th:replace="~{fragments/componentes :: badge('Urgente', 'alerta')}"></span></th:block>
				<th:block th:if="${c.retirado()}"><span th:replace="~{fragments/componentes :: badge('Retirado', 'neutro')}"></span></th:block>
				<th:block th:if="${c.requiereConfirmacion() and !c.confirmado()}"><span th:replace="~{fragments/componentes :: badge('Por confirmar', 'alerta')}"></span></th:block>
				<th:block th:if="${c.confirmado()}"><span th:replace="~{fragments/componentes :: badge('Confirmado', 'exito')}"></span></th:block>
			</span>
		</li>
	</ul>
</main>
</body>
</html>
