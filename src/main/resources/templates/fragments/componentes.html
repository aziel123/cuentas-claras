<!DOCTYPE html>
<!--/* Componentes base del sistema de diseño (skill sistema-diseno). Sin estilos ni scripts en línea. */-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Botón de formulario. variante: primario (uno por pantalla), secundario, peligro o texto. */-->
<button th:fragment="boton(texto, variante)" type="submit" class="btn"
	th:classappend="'btn-' + ${variante}" th:text="${texto}">Guardar</button>

<!--/* Enlace con aspecto de botón. href ya resuelto por quien llama, p. ej. @{/inicio}. */-->
<a th:fragment="enlaceBoton(texto, href, variante)" class="btn" th:classappend="'btn-' + ${variante}"
	th:href="${href}" th:text="${texto}">Ir</a>

<!--/* Campo de texto dentro de un formulario con th:object. La etiqueta siempre visible; ayuda y error debajo. */-->
<div th:fragment="campo(nombre, etiqueta, ayuda, autocompletar)" class="campo">
	<label th:for="${nombre}" th:text="${etiqueta}">Etiqueta</label>
	<input type="text" class="input" th:field="*{__${nombre}__}" th:errorclass="input-con-error"
		th:autocomplete="${autocompletar}" th:aria-describedby="${ayuda != null} ? ${nombre + '-ayuda'}"
		th:aria-invalid="${#fields.hasErrors(nombre)} ? 'true'" required>
	<p class="ayuda" th:if="${ayuda != null}" th:id="${nombre + '-ayuda'}" th:text="${ayuda}">Ayuda</p>
	<p class="error" th:if="${#fields.hasErrors(nombre)}" th:errors="*{__${nombre}__}">Error</p>
</div>

<!--/* Campo de clave: nunca se vuelve a mostrar lo escrito. */-->
<div th:fragment="campoClave(nombre, etiqueta, ayuda, autocompletar)" class="campo">
	<label th:for="${nombre}" th:text="${etiqueta}">Clave</label>
	<input type="password" class="input" th:id="${nombre}" th:name="${nombre}"
		th:classappend="${#fields.hasErrors(nombre)} ? 'input-con-error'"
		th:autocomplete="${autocompletar}" th:aria-describedby="${ayuda != null} ? ${nombre + '-ayuda'}"
		th:aria-invalid="${#fields.hasErrors(nombre)} ? 'true'" required>
	<p class="ayuda" th:if="${ayuda != null}" th:id="${nombre + '-ayuda'}" th:text="${ayuda}">Ayuda</p>
	<p class="error" th:if="${#fields.hasErrors(nombre)}" th:errors="*{__${nombre}__}">Error</p>
</div>

<!--/* Etiqueta de estado: siempre con texto, nunca solo color. variante: exito, alerta, peligro, info o neutro. */-->
<span th:fragment="badge(texto, variante)" class="badge" th:classappend="'badge-' + ${variante}"
	th:text="${texto}">Pagado</span>

<!--/* Alerta con ícono y texto. tipo: exito, info, advertencia o error. Los errores usan role="alert". */-->
<div th:fragment="alerta(tipo, mensaje)" class="alerta" th:classappend="'alerta-' + ${tipo}"
	th:attr="role=${tipo == 'error'} ? 'alert' : 'status'">
	<svg class="alerta-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
		stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
		<path th:if="${tipo == 'exito'}" d="M20 6 9 17l-5-5"/>
		<th:block th:if="${tipo == 'info'}"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></th:block>
		<th:block th:if="${tipo == 'advertencia' or tipo == 'error'}"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></th:block>
	</svg>
	<p th:text="${mensaje}">Mensaje</p>
</div>

<!--/* Lista vacía: explica qué pasa y cuál es el siguiente paso. */-->
<div th:fragment="estadoVacio(titulo, texto)" class="estado-vacio">
	<h3 th:text="${titulo}">Todavía no hay datos</h3>
	<p th:text="${texto}">Cuando los haya, aparecerán aquí.</p>
</div>

<!--/* Confirmación de una acción sensible, sin JavaScript (atributo popover).
     accion: URL ya resuelta del POST. conMotivo: exige un motivo de 10 a 500 caracteres (también se valida en el servidor). */-->
<th:block th:fragment="modalConfirmacion(id, titulo, consecuencia, accion, textoBoton, conMotivo)">
	<button type="button" class="btn btn-peligro" th:popovertarget="${id}" th:text="${textoBoton}">Anular</button>
	<div class="modal" th:id="${id}" popover role="dialog" aria-modal="true" th:aria-labelledby="${id + '-titulo'}">
		<form method="post" th:action="${accion}" class="modal-cuerpo">
			<h2 th:id="${id + '-titulo'}" th:text="${titulo}">¿Confirmas?</h2>
			<p th:text="${consecuencia}">Esta acción queda registrada.</p>
			<div class="campo" th:if="${conMotivo}">
				<label th:for="${id + '-motivo'}">Motivo (obligatorio)</label>
				<textarea class="input" th:id="${id + '-motivo'}" name="motivo" required minlength="10" maxlength="500"
					th:aria-describedby="${id + '-motivo-ayuda'}"></textarea>
				<p class="ayuda" th:id="${id + '-motivo-ayuda'}">Explica por qué, en al menos 10 caracteres. Quedará en la auditoría.</p>
			</div>
			<div class="acciones">
				<button type="button" class="btn btn-secundario" th:popovertarget="${id}" popovertargetaction="hide">Cancelar</button>
				<button type="submit" class="btn btn-peligro" th:text="${textoBoton}">Anular</button>
			</div>
		</form>
	</div>
</th:block>

<!--/* Tarjetas de los módulos del rol en el inicio. Los que aún no existen muestran "Próximamente". */-->
<div th:fragment="modulos(elementos)" class="modulos">
	<article class="tarjeta modulo" th:each="m : ${elementos}" th:unless="${m.codigo == 'INICIO'}"
		th:data-modulo="${m.codigo}" th:classappend="${m.disponible} ? 'modulo-disponible'">
		<div class="fila entre">
			<h3 th:text="${m.etiqueta}">Módulo</h3>
			<span th:if="${m.disponible}" class="badge badge-exito">Disponible</span>
			<span th:unless="${m.disponible}" class="badge badge-neutro" th:text="|Próximamente · ${m.etapa}|">Próximamente</span>
		</div>
		<p class="secundario" th:text="${m.descripcion}">Descripción</p>
		<a th:if="${m.disponible}" class="btn btn-secundario btn-chico" th:href="@{${m.ruta}}">Abrir</a>
	</article>
</div>

</body>
</html>
