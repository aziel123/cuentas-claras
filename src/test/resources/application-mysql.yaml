# Pruebas contra MySQL 8 real (job "mysql" del CI). Se activa junto con el perfil test: @ActiveProfiles({"test", "mysql"}).
# Como en producción: la aplicación usa cc_app y NO migra (el CI corre antes «java -jar ... migrar» con cc_migrador).
spring:
  datasource:
    url: ${CC_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&useSSL=false}
    username: cc_app
    password: ${CC_MYSQL_CLAVE_APP:}
  flyway:
    enabled: false

# Sprint 7, tanda 2: los procesos sistema.* y la identidad, con su propio usuario (como en producción).
cuentasclaras:
  basedatos:
    sistema:
      usuario: cc_sistema
      clave: ${CC_MYSQL_CLAVE_SISTEMA:}
      pool-maximo: 10
