# Perfil de pruebas: H2 en memoria en modo MySQL, separado de la base de desarrollo.
# LOCK_TIMEOUT amplio para las pruebas de concurrencia (cadena de auditoría, series, cobros): en una CI lenta no deben
# fallar por esperar un bloqueo (hallazgo 14 de QA). El pool admite los hilos de esas pruebas más el envío al OSE.
spring:
  datasource:
    url: jdbc:h2:mem:cuentasclaras-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 50

cuentasclaras:
  caja:
    # La cuenta de ejemplo del colegio 1 (sin conector CUENTA_BANCARIA).
    cuentas-deposito: BCP Soles 191-XXXXXXX-0-XX
  plataforma:
    # Sprint 8, tanda 1: las pruebas dan de alta colegios nuevos junto al colegio 1 (instalación compartida).
    instalacion: COMPARTIDA
  ciclo:
    # Sprint 11, tanda 1 (AP-8): en H2 se prueba el flujo de la suspensión (en MySQL la base lo rechaza sin V40). Las
    # tareas programadas no corren solas: las pruebas llaman a cada pasada.
    aplicacion-cron: "-"
    revision-cron: "-"
    suspension-disponible: true
  conectores:
    # Sprint 8, tanda 2: clave SOLO de pruebas (32 bytes en base64; su texto empieza con «clave-conectores-», que el
    # verificador rechaza fuera de dev y test). El job mysql del CI la cambia por la suya (CC_CLAVE_CONECTORES): con ella
    # arranca prod sobre los mismos secretos.
    clave: ${CC_CLAVE_CONECTORES:Y2xhdmUtY29uZWN0b3Jlcy1kZS1wcnVlYmFzLTAwMDE=}
  mensajeria:
    whatsapp:
      proveedor: SIMULADO
    correo:
      proveedor: SIMULADO
  comprobantes:
    # Hallazgo 13 de QA: el envío al OSE corre en el mismo hilo; no quedan hilos vivos entre una prueba y otra.
    envio-sincrono: true
  pasarela:
    proveedor: SIMULADA
    simulada:
      secreto-aviso: secreto-pasarela-simulada-de-pruebas-no-usar-en-produccion
  seguridad:
    # Las pruebas de bloqueo de cuenta (sprint 1) intentan siempre desde la misma conexión: bloqueo a los 5 y BCrypt con
    # el costo de antes (10), más rápido. El límite por conexión lo prueba LimiteIngresosPorIpTest con los valores de prod.
    intentos-maximos: 5
    costo-bcrypt: 10
  sesion:
    intentos-por-ip: 100000
    intentos-por-cuenta-e-ip: 100000
  libretas:
    # Correcciones del sprint 10 (P-5): sin ventana de agrupación, el aviso sale en la pasada siguiente a la emisión (las
    # pruebas corren con el reloj fijo). La ventana la prueba AvisosLibretasVentanaTest con su propio valor.
    ventana-avisos-minutos: 0
  tareas:
    # Sin tareas programadas en las pruebas: cada prueba invoca el proceso que necesita (reintentos, consultas).
    activas: false
  auditoria:
    # Clave SOLO para pruebas. En producción llega por la variable AUDITORIA_CLAVE_HMAC.
    clave-hmac: clave-hmac-de-pruebas-no-usar-en-produccion-0001

# Las pruebas con servidor real usan http: la cookie de sesión no puede exigir https.
server:
  servlet:
    session:
      cookie:
        secure: false
        # Sin https, el navegador rechaza una cookie __Host- (exige Secure).
        name: CCSESION
