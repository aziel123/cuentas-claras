# Perfil de pruebas: H2 en memoria en modo MySQL, separado de la base de desarrollo.
# LOCK_TIMEOUT amplio para las pruebas de concurrencia de la cadena de auditoría.
spring:
  datasource:
    url: jdbc:h2:mem:cuentasclaras-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""

cuentasclaras:
  auditoria:
    # Clave SOLO para pruebas. En producción llega por la variable AUDITORIA_CLAVE_HMAC.
    clave-hmac: clave-hmac-de-pruebas-no-usar-en-produccion-0001
