# Cuentas Claras · la DEMO en su propia VM (sprint 8, tanda 3; sección 8 del diseño). Misma imagen, perfil «demo»: H2 en
# memoria, datos ficticios, se reinicia cada noche a las 03:00 (deploy/systemd/cc-demo-reinicio.timer) y SIN SALIDA A
# INTERNET: la aplicación solo está en la red «interna» (internal: true, sin ruta hacia afuera); Caddy está en las dos
# redes (sale solo para obtener y renovar su certificado). La aplicación además bloquea su propia salida
# (SalidaBloqueadaDemo) y no arranca con una base real, un proveedor real ni un secreto en el entorno
# (VerificadorConfiguracion). Son capas independientes: lo prueba el job «demo» del CI.
#
# Uso:  docker compose -f compose.demo.yml --env-file /etc/cc/imagen.env up -d
# /etc/cc/demo.env (sin secretos): CC_MARCA_NOMBRE, CC_URL_PUBLICA=https://demo.<dominio> y, si se quiere mostrar el alta
#                                  a un prospecto, CC_OPERADORES (el equipo de ventas). NADA de DB_*, claves ni tokens.
name: cuentas-claras-demo

services:
  app:
    image: ${CC_IMAGEN:?Define CC_IMAGEN (ghcr.io/...@sha256:...) en /etc/cc/imagen.env}
    restart: unless-stopped
    env_file:
      - /etc/cc/demo.env
    environment:
      SPRING_PROFILES_ACTIVE: demo
      TZ: America/Lima
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1400m
    networks: [interna]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  caddy:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    env_file:
      - /etc/cc/caddy.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks: [interna, externa]
    depends_on: [app]

networks:
  # Sin salida: los contenedores de esta red solo se ven entre sí.
  interna:
    internal: true
  externa: {}

volumes:
  caddy_datos: {}
  caddy_config: {}
