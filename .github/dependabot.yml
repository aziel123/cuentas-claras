# Sprint 7, tanda 3 (A06 y A08 de OWASP, decisión 102): Dependabot propone cada semana las actualizaciones de las
# dependencias de Maven, de la imagen base del Dockerfile (eclipse-temurin) y de las acciones de GitHub (que el CI fija
# por SHA: Dependabot actualiza el SHA y el comentario con la versión). Cada propuesta pasa por el CI completo
# (pruebas, MySQL real, respaldo y el paso «dependencias») y la une una persona.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Lima
    open-pull-requests-limit: 5
    # Solo el pom.xml de la raíz: la muestra vulnerable de scripts/dependencias/ (log4j-core 2.14.1 a propósito) queda
    # fuera porque está en otra carpeta.
    labels: [dependencias]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Lima
    labels: [dependencias]
    # Los saltos de versión mayor de la imagen base (Java 21 → 25, Ubuntu 24.04 → 26.04, etc.) no se proponen solos: se
    # planifican y se prueban aparte. Dependabot sigue proponiendo las actualizaciones menores y de parche.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Sprint 8, tanda 3: la imagen base del contenedor de herramientas (respaldos, 01/02/03 y el paso 0) y la de Caddy de los
  # compose de la VM, también fijadas por digest.
  - package-ecosystem: docker
    directory: /deploy/herramientas
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Lima
    labels: [dependencias]
    # Los saltos de versión mayor de la imagen base (Java 21 → 25, Ubuntu 24.04 → 26.04, etc.) no se proponen solos: se
    # planifican y se prueban aparte. Dependabot sigue proponiendo las actualizaciones menores y de parche.
    ignore:
      - dependency-name: "*"
        # Ubuntu publica versiones intermedias no LTS (24.10, 25.04…) que Dependabot ve como «menores»: solo se aceptan
        # parches (nuevos digest de la misma versión). El paso a la siguiente LTS se planifica aparte.
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Lima
    labels: [dependencias]
    # Los saltos de versión mayor de la imagen base (Java 21 → 25, Ubuntu 24.04 → 26.04, etc.) no se proponen solos: se
    # planifican y se prueban aparte. Dependabot sigue proponiendo las actualizaciones menores y de parche.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Lima
    labels: [dependencias]
