          comprobar 1644 "INSERT INTO solicitud_cambio (colegio_id, tipo, entidad, entidad_id, resumen, datos, motivo, estado, pendiente, solicitado_por, resuelto_por, resuelto_en, creado_en, creado_por, actualizado_en) VALUES (0, 'ANULACION_PAGO', 'pago', 0, 'x', '{}', 'verificador de permisos', 'APROBADA', NULL, 'x.pide', 'y.aprueba', NOW(6), NOW(6), 'x.pide', NOW(6))"
          comprobar 1644 "INSERT INTO resolucion_respaldo (respaldo_id, colegio_id, usuario_id, motivo, creado_en, creado_por) VALUES (0, 0, 0, 'verificador de permisos', NOW(6), 'verificador')"
          comprobar 1142 "UPDATE resolucion_respaldo SET motivo = motivo WHERE 1 = 0"
          comprobar 1142 "DELETE FROM resolucion_respaldo WHERE 1 = 0"
          comprobar 1142 "INSERT INTO primera_direccion (colegio_id, usuario_id, creado_en, creado_por, actualizado_en) VALUES (1, ${personal}, NOW(6), 'x', NOW(6))"
          # Con cc_sistema: no edita la bitácora ni borra los libros (1142); sus inserciones imposibles llegan al trigger (1644).
          comprobar_sistema() {
            codigo="$1"; sql="$2"
            if salida=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_sistema -p"${CC_MYSQL_CLAVE_SISTEMA}" cuentasclaras -e "$sql" 2>&1); then
              echo "ERROR: cc_sistema pudo ejecutar: $sql"
              exit 1
            fi
            echo "$salida" | grep -q "ERROR $codigo" || { echo "Error inesperado: $salida"; exit 1; }
            echo "OK cc_sistema ($codigo): $sql"
          }
          comprobar_sistema 1142 "UPDATE evento_auditoria SET ip = ip WHERE 1 = 0"
          comprobar_sistema 1142 "DELETE FROM evento_auditoria WHERE 1 = 0"
          comprobar_sistema 1142 "DELETE FROM pago WHERE 1 = 0"
          comprobar_sistema 1142 "DELETE FROM sesion_usuario WHERE 1 = 0"
          comprobar_sistema 1143 "UPDATE sesion_usuario SET hash_token = hash_token WHERE 1 = 0"
          comprobar_sistema 1142 "UPDATE acceso_dato_personal SET familia_id = NULL WHERE 1 = 0"
          comprobar_sistema 1142 "DELETE FROM acceso_dato_personal WHERE 1 = 0"
          # Sprint 7, tanda 2: el comprobante, los mensajes y los avisos de la pasarela los actualiza solo cc_sistema (cc_app:
          # 1142, arriba), y solo las columnas del envío (1143).
          comprobar_sistema 1143 "UPDATE comprobante SET numero = numero WHERE 1 = 0"
          comprobar_sistema 1143 "UPDATE comprobante SET total = total WHERE 1 = 0"
          comprobar_sistema 1143 "UPDATE comprobante SET reemplaza_id = reemplaza_id WHERE 1 = 0"
          comprobar_sistema 1143 "UPDATE evento_pasarela SET orden_pago_id = orden_pago_id WHERE 1 = 0"
          for columna in destino parametros apoderado_id usuario_id plantilla tipo clave; do
            comprobar_sistema 1143 "UPDATE mensaje SET $columna = $columna WHERE 1 = 0"
          done
          comprobar_sistema 1644 "INSERT INTO firma_operacion (colegio_id, sesion_id, usuario_id, clave, token, creado_en, creado_por, actualizado_en) VALUES (0, 0, 0, 'verificador:0', REPEAT('0', 64), NOW(6), 'verificador', NOW(6))"
          comprobar_sistema 1644 "INSERT INTO sesion_usuario (colegio_id, usuario_id, hash_token, abierta_en, vence_en, creado_en, creado_por, actualizado_en) VALUES (0, 0, REPEAT('0', 64), NOW(6), NOW(6) + INTERVAL 1 HOUR, NOW(6), 'verificador', NOW(6))"
          comprobar_sistema 1644 "INSERT INTO semilla_muestreo (colegio_id, ambito, fecha, semilla, creado_en, creado_por, actualizado_en) VALUES (0, 'CAJA', '2000-01-03', 1, NOW(6), 'sistema.muestreo', NOW(6))"
          comprobar_sistema 1644 "INSERT INTO usuario (colegio_id, nombre_usuario, nombre_completo, clave_hash, activo, debe_cambiar_clave, creado_en, creado_por, actualizado_en) VALUES (0, 'verificador', 'x', 'x', TRUE, FALSE, NOW(6), 'verificador', NOW(6))"
          comprobar_sistema 1644 "INSERT INTO usuario_rol (usuario_id, rol) VALUES (${personal}, 'PROMOTOR')"
          comprobar_sistema 1644 "INSERT INTO muestra_llamada (colegio_id, semana, familia_id, motivo, creado_en, creado_por, actualizado_en) VALUES (0, '2000-01-03', 0, 'EFECTIVO', NOW(6), 'verificador', NOW(6))"
          comprobar_sistema 1644 "INSERT INTO huella_bitacora (colegio_id, fecha, secuencia, codigo, eventos_del_dia, creado_en, creado_por, actualizado_en) VALUES (0, '2000-01-01', 1, REPEAT('0', 16), 0, NOW(6), 'sistema.auditoria', NOW(6))"
          comprobar_sistema 1644 "UPDATE usuario SET telefono_whatsapp = '+51900000009' WHERE id = ${personal}"
          comprobar_sistema 1644 "UPDATE usuario SET apoderado_id = (SELECT MIN(id) FROM apoderado) WHERE id = ${personal}"
          comprobar_sistema 1644 "UPDATE mensaje SET proveedor = 'SIMULADO', proveedor_mensaje_id = CONCAT('SIM-', id), estado = 'ENVIADO', enviado_en = NOW(6), intentos = intentos + 1 WHERE clave LIKE 'pendiente-para-ci-%' AND estado = 'PENDIENTE'"
          # Correcciones del sprint 7: cc_sistema tampoco inserta una solicitud ya aprobada (1644), ni edita o borra la marca
          # de la primera Dirección (1142); una cuenta de Dirección no se desactiva sin su solicitud ESTADO_CUENTA (1644).
          comprobar_sistema 1644 "INSERT INTO solicitud_cambio (colegio_id, tipo, entidad, entidad_id, resumen, datos, motivo, estado, pendiente, solicitado_por, resuelto_por, resuelto_en, creado_en, creado_por, actualizado_en) VALUES (0, 'ANULACION_PAGO', 'pago', 0, 'x', '{}', 'verificador de permisos', 'APROBADA', NULL, 'x.pide', 'y.aprueba', NOW(6), NOW(6), 'x.pide', NOW(6))"
          comprobar_sistema 1142 "UPDATE primera_direccion SET version = version WHERE 1 = 0"
          comprobar_sistema 1142 "DELETE FROM primera_direccion WHERE 1 = 0"
          directora=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_app -p"${CC_MYSQL_CLAVE_APP}" cuentasclaras -N -e "SELECT MIN(u.id) FROM usuario u JOIN usuario_rol r ON r.usuario_id = u.id WHERE r.rol = 'DIRECTOR' AND u.activo")
          comprobar_sistema 1644 "UPDATE usuario SET activo = FALSE, desactivado_en = NOW(6), desactivado_por = 'ci' WHERE id = ${directora}"
          # Huellas (H7): cc_app ve las de los 75 triggers y las 7 funciones con huellas_objetos().
          objetos=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_app -p"${CC_MYSQL_CLAVE_APP}" cuentasclaras -N -e "SELECT JSON_LENGTH(huellas_objetos())")
          [ "$objetos" = "$((esperados + 7))" ] || { echo "ERROR: huellas_objetos() devuelve $objetos objetos"; exit 1; }
          echo "OK: huellas_objetos() devuelve $objetos objetos (triggers y funciones)"

      - name: Arranque real en prod con cc_app y cc_sistema, por TLS (y rechazo con cc_migrador, sin TLS o con un privilegio de más)
        env:
          SPRING_PROFILES_ACTIVE: prod
          # Sprint 7, tanda 2 (H11): en prod la conexión va cifrada (el MySQL del contenedor trae su certificado).
          DB_URL: "jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&sslMode=REQUIRED"
          DB_SISTEMA_USUARIO: cc_sistema
          DB_SISTEMA_CLAVE: ${{ env.CC_MYSQL_CLAVE_SISTEMA }}
          AUDITORIA_CLAVE_HMAC: "clave-hmac-del-job-de-integracion-continua-0001"
          # Sprint 5 (decisión 40): prod no arranca sin un canal real para avisar a las familias. Correo SMTP (no se
          # conecta al arrancar; la salud no depende del correo).
          MENSAJERIA_CORREO_PROVEEDOR: SMTP
          CORREO_REMITENTE: "avisos@ci.cuentasclaras.pe"
          SPRING_MAIL_HOST: "127.0.0.1"
        run: |
          DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" \
            java -jar target/cuentas-claras-*.jar --server.port=18080 > prod.log 2>&1 &
          PID_APP=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18080/actuator/health | grep -q UP && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18080/actuator/health | grep -q UP || { cat prod.log; exit 1; }
          grep -q "Permisos de la bitácora verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos de las cuotas verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos por columna y triggers de planes, lotes y solicitudes verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de caja, comprobantes, anulaciones, descuentos y cierres verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de pagos en línea, recaudación, conciliación y outbox del OSE verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de mensajería, acceso directo al titular y huella diaria verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de la renovación de matrícula, la matrícula reservada y los avisos de las familias" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de feriados, semilla del muestreo y cierre bancario mensual verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de la verificación de contactos, la huella por hora y los feriados aprobados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers del panel (resumen diario, alertas a Promotoría, contacto del personal y llamadas de control) verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de las correcciones del sprint 6 (muestra congelada, delegación de las llamadas, texto del resumen y correo externo por colegio) verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos del respaldo verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Triggers verificados: están los" prod.log || { cat prod.log; exit 1; }
          # Sprint 7, tanda 2 (sección 6.5).
          grep -q "Conexiones verificadas: las personas con cc_app y los procesos y la identidad con cc_sistema" prod.log || { cat prod.log; exit 1; }
          grep -q "Identidad, sesiones y firmas verificadas: cc_app no crea cuentas ni firma como sistema" prod.log || { cat prod.log; exit 1; }
          grep -q "Huellas de los 75 triggers y las 7 funciones verificadas" prod.log || { cat prod.log; exit 1; }
          grep -q "Privilegios verificados: cc_app y cc_sistema tienen solo los de 02-permisos-tablas.sql, sin roles anidados" prod.log || { cat prod.log; exit 1; }
          grep -q "Conexiones a MySQL cifradas (TLS) verificadas" prod.log || { cat prod.log; exit 1; }
          # Sprint 7, tanda 3 (V26, Ley 29733).
          grep -q "Permisos de la Ley 29733 verificados" prod.log || { cat prod.log; exit 1; }
          # Sprint 7: en prod el log es JSON (ECS) y las sondas de vida y de disponibilidad son públicas.
          grep -q '^{"@timestamp".*Triggers verificados' prod.log || { echo "ERROR: el log de prod no es JSON"; head -n 5 prod.log; exit 1; }

          curl -sf http://127.0.0.1:18080/actuator/health/liveness | grep -q UP || { cat prod.log; exit 1; }
          curl -sf http://127.0.0.1:18080/actuator/health/readiness | grep -q UP || { cat prod.log; exit 1; }
          curl -sf http://127.0.0.1:18080/salud/respaldo | grep -qx "ATRASADO\|OK" || { echo "ERROR: /salud/respaldo"; exit 1; }

          # Sprint 7, tanda 3 (A02, A05, E22): cabeceras de seguridad y cookie __Host- del servidor real de prod.
          curl -s -D cabeceras.txt -o login.html http://127.0.0.1:18080/login
          for cabecera in "Strict-Transport-Security: max-age=31536000 ; includeSubDomains" \
              "Cross-Origin-Opener-Policy: same-origin" "Cross-Origin-Resource-Policy: same-origin" \
              "Content-Security-Policy: default-src 'self'" "X-Frame-Options: DENY" "X-Content-Type-Options: nosniff"; do
            grep -qi "^$cabecera" cabeceras.txt || { echo "ERROR: falta la cabecera $cabecera"; cat cabeceras.txt; exit 1; }
          done
          grep -i "^Set-Cookie: __Host-CCSESION=" cabeceras.txt | grep -qi "Path=/" || { cat cabeceras.txt; exit 1; }
          grep -i "^Set-Cookie: __Host-CCSESION=" cabeceras.txt | grep -i "Secure" | grep -qi "HttpOnly" \
            || { echo "ERROR: la cookie de sesión no es __Host- con Secure y HttpOnly"; cat cabeceras.txt; exit 1; }
          if grep -i "^Set-Cookie: __Host-CCSESION=" cabeceras.txt | grep -qi "Domain="; then
            echo "ERROR: una cookie __Host- no lleva dominio"; exit 1
          fi
          echo "OK: HSTS, COOP, CORP, CSP y la cookie __Host-CCSESION (Secure, HttpOnly, Path=/, sin dominio)"
          # Sprint 7, tanda 3 (H9, E24): 5 intentos fallidos con un usuario desde esta conexión y la 6.a espera (429, la
          # página de ingreso con el aviso), sin llegar a la cuenta. La cookie Secure se envía a mano (curl no la manda
          # por http).
          cookie=$(grep -i "^Set-Cookie: __Host-CCSESION=" cabeceras.txt | sed -e 's/^[^:]*: //' -e 's/;.*//' | tr -d '\r')
          token=$(grep -o 'name="_csrf" value="[^"]*"' login.html | sed 's/.*value="//; s/"$//')
          for i in 1 2 3 4 5; do
            estado=$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: $cookie" \
              --data-urlencode "usuario=nadie.ci" --data-urlencode "clave=no-es-la-clave" --data-urlencode "_csrf=$token" \
              http://127.0.0.1:18080/login)
            [ "$estado" = "302" ] || { echo "ERROR: el intento $i respondió $estado"; exit 1; }
          done
          estado=$(curl -s -o espera.html -w '%{http_code}' -H "Cookie: $cookie" \
            --data-urlencode "usuario=nadie.ci" --data-urlencode "clave=no-es-la-clave" --data-urlencode "_csrf=$token" \
            http://127.0.0.1:18080/login)
          [ "$estado" = "429" ] || { echo "ERROR: el 6.o intento respondió $estado (esperaba 429)"; exit 1; }
          grep -q "Demasiados intentos con este usuario desde esta conexi" espera.html \
            || { echo "ERROR: la página del 429 no trae el aviso"; cat espera.html; exit 1; }
          echo "OK: tras 5 intentos fallidos la conexión espera (429) sin bloquear la cuenta"

          kill "$PID_APP"
          if DB_USUARIO=cc_migrador DB_CLAVE="${CC_MYSQL_CLAVE_MIGRADOR}" timeout 120 \
               java -jar target/cuentas-claras-*.jar --server.port=18081 > prod-migrador.log 2>&1; then
            echo "ERROR: la aplicación arrancó con un usuario que puede editar la bitácora"; exit 1
          fi
          grep -q "PUEDE ejecutar" prod-migrador.log || { cat prod-migrador.log; exit 1; }
          echo "OK: arranca con cc_app y se niega con cc_migrador"
          # E9: sin TLS no arranca.
          if DB_URL="${CC_MYSQL_URL}" DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" timeout 120 \
               java -jar target/cuentas-claras-*.jar --server.port=18083 > prod-sin-tls.log 2>&1; then
            echo "ERROR: la aplicación arrancó en prod sin TLS"; exit 1
          fi
          grep -q "no va cifrada (TLS)" prod-sin-tls.log || { cat prod-sin-tls.log; exit 1; }
          # E9: el mismo usuario para las personas y los procesos no arranca.
          if DB_USUARIO=cc_sistema DB_CLAVE="${CC_MYSQL_CLAVE_SISTEMA}" timeout 120 \
               java -jar target/cuentas-claras-*.jar --server.port=18084 > prod-mismo-usuario.log 2>&1; then
            echo "ERROR: la aplicación arrancó con el mismo usuario en los dos pools"; exit 1
          fi
          grep -q "no pueden ser el mismo usuario" prod-mismo-usuario.log || { cat prod-mismo-usuario.log; exit 1; }
          # E9: un privilegio de más (TRIGGER sobre el esquema) no deja arrancar; 02 lo quita.
          $MYSQL_ADMIN -e "GRANT TRIGGER ON cuentasclaras.* TO 'cc_app'@'%'"
          if DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" timeout 120 \
               java -jar target/cuentas-claras-*.jar --server.port=18085 > prod-privilegio.log 2>&1; then
            echo "ERROR: la aplicación arrancó con un privilegio de más"; exit 1
          fi
          grep -q "tiene privilegios que 02-permisos-tablas.sql no da" prod-privilegio.log || { cat prod-privilegio.log; exit 1; }
          $MYSQL_ADMIN < scripts/mysql/02-permisos-tablas.sql
          echo "OK: sin TLS, con el mismo usuario o con un privilegio de más, prod no arranca"

      - name: "M2: prod no arranca si falta un trigger BEFORE UPDATE (y vuelve a arrancar al restaurarlo)"
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: "jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&sslMode=REQUIRED"
          DB_SISTEMA_USUARIO: cc_sistema
          DB_SISTEMA_CLAVE: ${{ env.CC_MYSQL_CLAVE_SISTEMA }}
          AUDITORIA_CLAVE_HMAC: "clave-hmac-del-job-de-integracion-continua-0001"
          MENSAJERIA_CORREO_PROVEEDOR: SMTP
          CORREO_REMITENTE: "avisos@ci.cuentasclaras.pe"
          SPRING_MAIL_HOST: "127.0.0.1"
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_migrador -p"${CC_MYSQL_CLAVE_MIGRADOR}" cuentasclaras \
            -e "DROP TRIGGER trg_mensaje_envio"
          if DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" timeout 120 \
               java -jar target/cuentas-claras-*.jar --server.port=18082 > prod-sin-trigger.log 2>&1; then
            echo "ERROR: la aplicación arrancó sin trg_mensaje_envio"; exit 1
          fi
          # Sprint 7, tanda 2: lo nombran primero las huellas («Faltan: …»); sin la función, la lista de triggers.
          grep -q "Faltan: trg_mensaje_envio\|Faltan triggers en la base: trg_mensaje_envio" prod-sin-trigger.log \
            || { cat prod-sin-trigger.log; exit 1; }
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_migrador -p"${CC_MYSQL_CLAVE_MIGRADOR}" cuentasclaras \
            < scripts/mysql/03-triggers.sql
          echo "OK: sin el trigger BEFORE UPDATE, prod no arranca; restaurado con 03-triggers.sql"

      - name: "M3 (E7 y E8): un trigger debilitado con el mismo nombre, una función reemplazada o un trigger de más no dejan arrancar prod"
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: "jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&sslMode=REQUIRED"
          DB_SISTEMA_USUARIO: cc_sistema
          DB_SISTEMA_CLAVE: ${{ env.CC_MYSQL_CLAVE_SISTEMA }}
          AUDITORIA_CLAVE_HMAC: "clave-hmac-del-job-de-integracion-continua-0001"
          MENSAJERIA_CORREO_PROVEEDOR: SMTP
          CORREO_REMITENTE: "avisos@ci.cuentasclaras.pe"
          SPRING_MAIL_HOST: "127.0.0.1"
        run: |
          migrador() {
            mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_migrador -p"${CC_MYSQL_CLAVE_MIGRADOR}" cuentasclaras "$@"
          }
          no_arranca() {
            caso="$1"; esperado="$2"
            if DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" timeout 120 \
                 java -jar target/cuentas-claras-*.jar --server.port=18086 > "prod-$caso.log" 2>&1; then
              echo "ERROR: la aplicación arrancó con $caso"; exit 1
            fi
            grep -q "$esperado" "prod-$caso.log" || { cat "prod-$caso.log"; exit 1; }
            echo "OK: con $caso, prod no arranca ($esperado)"
          }
          # 1. trg_usuario_rol_alta sin el bloque de Promotoría y Dirección (como el de antes del sprint 7).
          migrador <<'SQL'
          DELIMITER //
          DROP TRIGGER trg_usuario_rol_alta//
          CREATE TRIGGER trg_usuario_rol_alta BEFORE INSERT ON usuario_rol FOR EACH ROW
          BEGIN
              IF SUBSTRING_INDEX(SESSION_USER(), '@', 1) <> 'cc_sistema' THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'cuentasclaras: los roles los cambia solo cc_sistema';
              END IF;
          END//
          DELIMITER ;
          SQL
          no_arranca "trigger-debilitado" "huella distinta: trg_usuario_rol_alta"
          migrador < scripts/mysql/03-triggers.sql
          # 2. cc_es_sistema() reemplazada por una que siempre dice TRUE (cc_app firmaría como sistema).
          migrador -e "DROP FUNCTION cc_es_sistema; CREATE FUNCTION cc_es_sistema() RETURNS BOOLEAN NO SQL RETURN TRUE"
          no_arranca "funcion-reemplazada" "huella distinta: cc_es_sistema"
          migrador < scripts/mysql/03-triggers.sql
          # 3. Un trigger de más (que no está en 03-triggers.sql).
          migrador -e "CREATE TRIGGER trg_de_mas BEFORE INSERT ON colegio FOR EACH ROW SET NEW.nombre = NEW.nombre"
          no_arranca "trigger-de-mas" "Sobran (no están en 03-triggers.sql ni en 02): trg_de_mas"
          migrador -e "DROP TRIGGER trg_de_mas"
          # Restaurada, vuelve a arrancar.
          DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" java -jar target/cuentas-claras-*.jar --server.port=18087 > prod-restaurada.log 2>&1 &
          PID_APP=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18087/actuator/health | grep -q UP && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18087/actuator/health | grep -q UP || { cat prod-restaurada.log; exit 1; }
          kill "$PID_APP"
          echo "OK: restaurados 02 y 03, prod vuelve a arrancar"

  respaldo:
    name: Respaldo cifrado, restauración real y ataques E29 a E32
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      # Segundo MySQL, VACÍO: ahí se restaura (como la máquina del simulacro semanal).
      restauracion:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root-restauracion-ci
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-restauracion-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # Claves SOLO para las bases desechables de este job.
      CC_PRUEBA_MYSQL: "true"
      CC_MYSQL_URL: "jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&useSSL=false"
      CC_MYSQL_CLAVE_MIGRADOR: "migrador-solo-ci-2"
      CC_MYSQL_CLAVE_APP: "app-solo-ci-2"
      CC_MYSQL_CLAVE_SISTEMA: "sistema-solo-ci-2"
      CC_MYSQL_CLAVE_RESPALDO: "respaldo-solo-ci-2"
      MYSQL_ADMIN: "mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot-ci"
      # El respaldo (scripts/respaldo/respaldar.sh) como en el servidor: cc_respaldo y dos destinatarios age.
      RESPALDO_DB_HOST: "127.0.0.1"
      RESPALDO_DB_PUERTO: "3306"
      RESPALDO_DB_USUARIO: "cc_respaldo"
      RESPALDO_DB_CLAVE: "respaldo-solo-ci-2"
      # Destino «real» del CI: un remoto de rclone cuyas credenciales llegan SOLO por variables (aquí, un alias a una
      # carpeta del runner en lugar del almacenamiento de objetos con bloqueo).
      RESPALDO_DESTINO: "cirespaldos"
      RCLONE_CONFIG_CIRESPALDOS_TYPE: "alias"
      RCLONE_CONFIG_CIRESPALDOS_REMOTE: "/tmp/cc-respaldos-ci"
      RCLONE_CONFIG_CIFORJADO_TYPE: "alias"
      RCLONE_CONFIG_CIFORJADO_REMOTE: "/tmp/cc-respaldos-forjados"
      # La restauración, en el segundo MySQL.
      RESTAURAR_DB_HOST: "127.0.0.1"
      RESTAURAR_DB_PUERTO: "3308"
      RESTAURAR_DB_ADMIN: "root"
      RESTAURAR_DB_ADMIN_CLAVE: "root-restauracion-ci"
      MYSQL_RESTAURACION: "mysql --protocol=TCP -h 127.0.0.1 -P 3308 -uroot -proot-restauracion-ci"
      # La clave HMAC con la que las pruebas sellaron la bitácora (perfil test): la verificación recalcula toda la cadena.
      CLAVE_HMAC_PRUEBAS: "clave-hmac-de-pruebas-no-usar-en-produccion-0001"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Empaquetar la aplicación
        run: ./mvnw -B -q -DskipTests package

      - name: "age y rclone de los paquetes de Ubuntu (sin binarios de otras fuentes)"
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q age rclone
          age --version
          rclone version | head -n 1

      - name: Base de origen como la del job mysql (V1–V27, permisos y triggers)
        run: |
          sed -e "s/__CLAVE_MIGRADOR__/${CC_MYSQL_CLAVE_MIGRADOR}/" -e "s/__CLAVE_APP__/${CC_MYSQL_CLAVE_APP}/" \
              -e "s/__CLAVE_RESPALDO__/${CC_MYSQL_CLAVE_RESPALDO}/" -e "s/__CLAVE_SISTEMA__/${CC_MYSQL_CLAVE_SISTEMA}/" \
              scripts/mysql/01-usuarios.sql | $MYSQL_ADMIN
          DB_URL="$CC_MYSQL_URL" DB_MIGRADOR_USUARIO=cc_migrador DB_MIGRADOR_CLAVE="$CC_MYSQL_CLAVE_MIGRADOR" \
            java -jar target/cuentas-claras-*.jar migrar
          $MYSQL_ADMIN < scripts/mysql/02-permisos-tablas.sql
          $MYSQL_ADMIN -e "SET PERSIST log_bin_trust_function_creators = 1"
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_migrador -p"${CC_MYSQL_CLAVE_MIGRADOR}" cuentasclaras \
            < scripts/mysql/03-triggers.sql
          $MYSQL_ADMIN cuentasclaras -e "INSERT INTO colegio (nombre) VALUES ('Colegio de renovacion CI')"

      - name: "Datos de todas las pruebas de MySQL (fase 2: cobros, anulaciones, mensajes, bitácora...)"
        run: ./mvnw -B test -Dtest=PermisosMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Claves age desechables (Promotoría y responsable técnico)
        run: |
          mkdir -p /tmp/cc-claves && chmod 700 /tmp/cc-claves
          age-keygen -o /tmp/cc-claves/promotoria.txt 2>/dev/null
          age-keygen -o /tmp/cc-claves/responsable.txt 2>/dev/null
          echo "RESPALDO_AGE_DESTINATARIOS=$(age-keygen -y /tmp/cc-claves/promotoria.txt) $(age-keygen -y /tmp/cc-claves/responsable.txt)" >> "$GITHUB_ENV"
          echo "RESTAURAR_AGE_IDENTIDAD=/tmp/cc-claves/responsable.txt" >> "$GITHUB_ENV"

      - name: "Sin credenciales del destino o con un solo destinatario, el respaldo no empieza"
        run: sh scripts/respaldo/pruebas-ci.sh sin-credenciales

      - name: "Respaldo 1: volcado cifrado al destino, manifiesto y registro como cc_respaldo"
        run: sh scripts/respaldo/pruebas-ci.sh primer-respaldo

      - name: "E29: el respaldo robado no se puede leer (ningún DNI ni apellido de la base en el .age)"
        run: sh scripts/respaldo/pruebas-ci.sh e29

      - name: "Restauración real en el segundo MySQL: verifica la cadena HMAC, los libros y arranca prod sobre la copia"
        run: sh scripts/respaldo/pruebas-ci.sh restauracion

      - name: "E31: un respaldo alterado (un evento cambiado y vuelto a cifrar, con su manifiesto) no verifica"
        run: sh scripts/respaldo/pruebas-ci.sh e31

      - name: "E30: un DBA borra un pago después del respaldo: el respaldo siguiente avisa «faltan filas»"
        run: sh scripts/respaldo/pruebas-ci.sh e30

      - name: "E32: un DBA recorta el final de la bitácora (y el eslabón): el respaldo siguiente avisa por el ancla"
        run: sh scripts/respaldo/pruebas-ci.sh e32

      - name: "QA-S7-1: un segundo respaldo NO borra la alerta «faltan filas» (y la base rechaza IGUAL mientras no se resuelva)"
        run: sh scripts/respaldo/pruebas-ci.sh faltan-filas-sigue

      - name: "Simulacro semanal (sin la clave HMAC) del último respaldo: detecta el recorte y el pago borrado"
        run: sh scripts/respaldo/pruebas-ci.sh restauracion-sin-clave

      - name: "S7-M1: el simulacro semanal relee los GRANT de prod (un rol anidado en cc_negocio aparece) y 02 lo quita"
        run: sh scripts/respaldo/pruebas-ci.sh permisos-anidados

      - name: "QA-S7-1: Promotoría resuelve la alerta con motivo y su firma (sin firma o sin Promotoría, 1644)"
        run: CC_PRUEBA_RESOLUCION_RESPALDO=true ./mvnw -B test -Dtest=ResolucionRespaldoMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "QA-S7-1: resuelta, el respaldo siguiente vuelve a IGUAL"
        run: sh scripts/respaldo/pruebas-ci.sh resuelto

      - name: "Destino simulado: solo con la fila del DBA (nunca en prod); sin ella, la base no lo registra (1644)"
        run: sh scripts/respaldo/pruebas-ci.sh simulado
