name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar, migrar y probar
        run: ./mvnw -B verify

      - name: Las pruebas no dependen de la zona horaria del servidor
        run: ./mvnw -B test -DargLine=-Duser.timezone=America/Los_Angeles

  mysql:
    name: Migraciones, permisos y arranque en MySQL 8
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # Claves SOLO para la base desechable de este job. Producción usa el gestor de secretos.
      CC_PRUEBA_MYSQL: "true"
      CC_MYSQL_URL: "jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&useSSL=false"
      CC_MYSQL_CLAVE_MIGRADOR: "migrador-solo-ci-1"
      CC_MYSQL_CLAVE_APP: "app-solo-ci-1"
      MYSQL_ADMIN: "mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot-ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Empaquetar la aplicación
        run: ./mvnw -B -q -DskipTests package

      - name: Crear la base y los usuarios cc_migrador y cc_app
        run: |
          sed -e "s/__CLAVE_MIGRADOR__/${CC_MYSQL_CLAVE_MIGRADOR}/" \
              -e "s/__CLAVE_APP__/${CC_MYSQL_CLAVE_APP}/" \
              scripts/mysql/01-usuarios.sql | $MYSQL_ADMIN

      - name: Migrar con cc_migrador (modo migrar, sin servidor web)
        env:
          DB_URL: ${{ env.CC_MYSQL_URL }}
          DB_MIGRADOR_USUARIO: cc_migrador
          DB_MIGRADOR_CLAVE: ${{ env.CC_MYSQL_CLAVE_MIGRADOR }}
        run: java -jar target/cuentas-claras-*.jar migrar

      - name: "Fase 1: Hibernate valida el esquema con cc_app y no faltan migraciones"
        run: ./mvnw -B test -Dtest=MigracionMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Permisos por tabla de cc_app
        run: $MYSQL_ADMIN < scripts/mysql/02-permisos-tablas.sql

      - name: "Fase 2: la aplicación funciona con los permisos mínimos de cc_app"
        run: ./mvnw -B test -Dtest=PermisosMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "cc_app no edita la bitácora ni borra datos financieros (1142) ni cambia montos de cuotas (1143)"
        run: |
          comprobar() {
            codigo="$1"; sql="$2"
            if salida=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_app -p"${CC_MYSQL_CLAVE_APP}" cuentasclaras -e "$sql" 2>&1); then
              echo "ERROR: cc_app pudo ejecutar: $sql"
              exit 1
            fi
            echo "$salida" | grep -q "ERROR $codigo" || { echo "Error inesperado: $salida"; exit 1; }
            echo "OK ($codigo): $sql"
          }
          comprobar 1142 "UPDATE evento_auditoria SET ip = ip WHERE 1 = 0"
          comprobar 1142 "DELETE FROM evento_auditoria WHERE 1 = 0"
          for tabla in cuota plan_pension lote_saldo_inicial linea_saldo_inicial; do
            comprobar 1142 "DELETE FROM $tabla WHERE 1 = 0"
          done
          comprobar 1143 "UPDATE cuota SET monto = monto WHERE 1 = 0"
          comprobar 1143 "UPDATE cuota SET fecha_vencimiento = fecha_vencimiento WHERE 1 = 0"
          comprobar 1143 "UPDATE cuota SET alumno_id = alumno_id WHERE 1 = 0"
          comprobar 1143 "UPDATE cuota SET clave = clave WHERE 1 = 0"

      - name: Arranque real en prod con cc_app (y rechazo con cc_migrador)
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: ${{ env.CC_MYSQL_URL }}
          AUDITORIA_CLAVE_HMAC: "clave-hmac-del-job-de-integracion-continua-0001"
        run: |
          DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" \
            java -jar target/cuentas-claras-*.jar --server.port=18080 > prod.log 2>&1 &
          PID_APP=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18080/actuator/health | grep -q UP && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18080/actuator/health | grep -q UP || { cat prod.log; exit 1; }
          grep -q "Permisos de la bitácora verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos de las cuotas verificados" prod.log || { cat prod.log; exit 1; }
          kill "$PID_APP"
          if DB_USUARIO=cc_migrador DB_CLAVE="${CC_MYSQL_CLAVE_MIGRADOR}" timeout 120 \
               java -jar target/cuentas-claras-*.jar --server.port=18081 > prod-migrador.log 2>&1; then
            echo "ERROR: la aplicación arrancó con un usuario que puede editar la bitácora"; exit 1
          fi
          grep -q "PUEDE ejecutar" prod-migrador.log || { cat prod-migrador.log; exit 1; }
          echo "OK: arranca con cc_app y se niega con cc_migrador"
