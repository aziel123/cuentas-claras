name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sprint 7, tanda 3 (A08 de OWASP, H13): toda acción de terceros va fijada por el SHA de su commit (una etiqueta se
# puede mover); el comentario dice la versión. Dependabot (.github/dependabot.yml) propone las actualizaciones.
permissions:
  contents: read

jobs:
  verificar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar, migrar y probar
        run: ./mvnw -B verify

      - name: Las pruebas no dependen de la zona horaria del servidor
        run: ./mvnw -B test -DargLine=-Duser.timezone=America/Los_Angeles

  dependencias:
    name: Dependencias con vulnerabilidades conocidas (SBOM y OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: "SBOM CycloneDX de lo que va en el jar"
        run: |
          ./mvnw -B -q -DskipTests package
          test -s target/classes/META-INF/sbom/application.cdx.json

      - name: "Sprint 7, tanda 3 (A06, decisión 102): ninguna CRÍTICA ni ALTA con arreglo publicado"
        run: sh scripts/dependencias/revisar.sh target/classes/META-INF/sbom/application.cdx.json

      - name: "E26: la revisión SÍ falla con una dependencia vulnerable (muestra con log4j-core 2.14.1)"
        run: |
          ./mvnw -B -q -f scripts/dependencias/muestra-vulnerable/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom
          if sh scripts/dependencias/revisar.sh scripts/dependencias/muestra-vulnerable/target/muestra.cdx.json > muestra.txt 2>&1; then
            cat muestra.txt; echo "ERROR: la revisión no detectó log4j-core 2.14.1"; exit 1
          fi
          grep -q "BLOQUEA (CRÍTICA o ALTA con arreglo): log4j-core 2.14.1" muestra.txt || { cat muestra.txt; exit 1; }
          echo "OK: la muestra vulnerable no pasa (Log4Shell detectado)"

  secretos:
    name: Ningún secreto en el repositorio (gitleaks, E26)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Sprint 8, tanda 3 (E26): gitleaks (imagen oficial fijada por digest) sobre TODA la historia de git. Las reglas
      # son las de gitleaks más una lista cerrada de valores inventados de las pruebas (.gitleaks.toml).
      # Correcciones del sprint 8 (S8-B2): la configuración NO se toma del propio PR (que podría agregar a la lista blanca
      # el secreto que trae): en un PR se usa la de la rama destino (main); en main, la de main. Además .gitleaks.toml y
      # .github/ tienen dueño en CODEOWNERS (la revisión del dueño es obligatoria con la protección de la rama).
      - name: "gitleaks sobre la historia del repositorio (configuración de la rama destino)"
        env:
          RAMA_BASE: ${{ github.base_ref }}
        run: |
          mkdir -p /tmp/gitleaks
          if [ -n "$RAMA_BASE" ]; then
            git fetch --no-tags --depth=1 origin "$RAMA_BASE"
          fi
          if [ -n "$RAMA_BASE" ] && ! git cat-file -e "origin/$RAMA_BASE:.gitleaks.toml" 2>/dev/null; then
            # Solo el PR que introduce .gitleaks.toml: la rama destino aún no lo tiene, así que se usa el del PR.
            # Desde que llega a main, aplica la regla de abajo (la de la rama destino).
            echo "AVISO: $RAMA_BASE aún no tiene .gitleaks.toml; se usa el de este PR (revísalo en la revisión del PR)."
            cp .gitleaks.toml /tmp/gitleaks/gitleaks.toml
          elif [ -n "$RAMA_BASE" ]; then
            git show "origin/$RAMA_BASE:.gitleaks.toml" > /tmp/gitleaks/gitleaks.toml
            if ! git diff --quiet "origin/$RAMA_BASE" HEAD -- .gitleaks.toml; then
              echo "AVISO: este PR cambia .gitleaks.toml; se revisa con la de $RAMA_BASE (el cambio lo aprueba su dueño)."
            fi
          else
            cp .gitleaks.toml /tmp/gitleaks/gitleaks.toml
          fi
          docker run --rm -v "$PWD:/repo" -v /tmp/gitleaks:/config:ro \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --no-banner --redact --config /config/gitleaks.toml

      - name: "E26: la revisión SÍ falla con un secreto de muestra (un token de GitHub inventado, generado aquí)"
        run: |
          mkdir -p /tmp/muestra-secreto
          echo "GITHUB_TOKEN=ghp_$(head -c 400 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > /tmp/muestra-secreto/app.env
          if docker run --rm -v /tmp/muestra-secreto:/muestra -v /tmp/gitleaks/gitleaks.toml:/gitleaks.toml:ro \
              ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
              dir /muestra --no-banner --redact --config /gitleaks.toml; then
            echo "ERROR: gitleaks no detectó el token de muestra"; exit 1
          fi
          echo "OK: un secreto de muestra no pasa"

  demo:
    name: "Demo (perfil demo): sin salida a internet, franja DEMO, «Crear mi demo» y no arranca con secretos (E20 a E22)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construir la imagen (el mismo Dockerfile del despliegue)
        run: docker build -q -t cuentas-claras:ci .

      - name: Arrancar la demo en una red de Docker SIN SALIDA (internal true), como en deploy/compose.demo.yml
        run: |
          docker network create --internal cc-demo-interna
          # Por http (sin Caddy): la cookie sin «Secure» (en la VM va por https con __Host-CCSESION).
          docker run -d --name cc-demo --network cc-demo-interna --read-only --tmpfs /tmp \
            -e SPRING_PROFILES_ACTIVE=demo -e CC_MARCA_NOMBRE="Cuentas Claras CI" \
            -e SERVER_SERVLET_SESSION_COOKIE_SECURE=false -e CC_COOKIE_SESION=CCSESION cuentas-claras:ci
          for i in $(seq 1 90); do
            docker exec cc-demo curl -sf http://127.0.0.1:8080/actuator/health/readiness | grep -q UP && break
            sleep 2
          done
          docker exec cc-demo curl -sf http://127.0.0.1:8080/actuator/health/readiness | grep -q UP || { docker logs cc-demo; exit 1; }
          docker logs cc-demo 2>&1 | grep -q "Demo: salida a internet bloqueada" || { docker logs cc-demo; exit 1; }
          echo "OK: la demo arrancó con H2 en memoria y la salida de la aplicación bloqueada"

      - name: "E20: desde el contenedor de la demo, internet no responde (ni por nombre ni por IP)"
        run: |
          # Primero, que la demo esté corriendo (si no, «no responde» sería un falso positivo).
          docker exec cc-demo true
          # Correcciones del sprint 8 (S8-B1): control positivo de la prueba por /dev/tcp (con bash; dash no lo tiene).
          docker exec cc-demo bash -c 'timeout 10 bash -c "exec 3<>/dev/tcp/127.0.0.1/8080"' \
            || { echo "ERROR: la prueba por /dev/tcp no funciona en el contenedor"; exit 1; }
          if docker exec cc-demo curl -sS --max-time 15 -o /dev/null https://graph.facebook.com; then
            echo "ERROR: la demo llegó a graph.facebook.com"; exit 1
          fi
          if docker exec cc-demo bash -c 'timeout 10 bash -c "exec 3<>/dev/tcp/142.250.0.1/443"' 2>/dev/null; then
            echo "ERROR: la demo abrió una conexión a internet por IP"; exit 1
          fi
          echo "OK (E20): sin salida a internet"

      - name: "La franja dice DEMO y «Crear mi demo» devuelve un colegio con 6 cuentas (la cajera es Lucía Ramos)"
        run: |
          docker exec cc-demo curl -s -c /tmp/c -o /tmp/demo.html http://127.0.0.1:8080/demo
          docker exec cc-demo grep -q "DEMO · Datos ficticios" /tmp/demo.html
          docker exec cc-demo curl -s -I http://127.0.0.1:8080/demo | grep -qi "^X-Robots-Tag: noindex"
          token=$(docker exec cc-demo grep -o 'name="_csrf" value="[^"]*"' /tmp/demo.html | sed 's/.*value="//; s/"$//')
          docker exec cc-demo curl -s -b /tmp/c -c /tmp/c -o /tmp/creada.html --data-urlencode "_csrf=$token" \
            http://127.0.0.1:8080/demo
          test "$(docker exec cc-demo grep -c "Entrar como" /tmp/creada.html)" = "6" \
            || { docker exec cc-demo cat /tmp/creada.html; docker logs cc-demo; exit 1; }
          docker exec cc-demo grep -q "Lucía Ramos" /tmp/creada.html
          docker exec cc-demo grep -q "data-clave-demo" /tmp/creada.html
          echo "OK: franja DEMO, sin indexar y un colegio ficticio con 6 cuentas"

      - name: "Sprint 9, tanda 1: el docente de la demo entra y ve sus dos secciones (tutor de 3.° A y Matemática en 4.° A) sin montos"
        run: |
          clave=$(docker exec cc-demo grep -o 'clave-temporal-valor num">[^<]*' /tmp/creada.html | sed 's/.*">//')
          docente=$(docker exec cc-demo grep -o '>[a-z0-9]*\.docente<' /tmp/creada.html | tr -d '<>' | head -1)
          [ -n "$clave" ] && [ -n "$docente" ] || { echo "ERROR: no encontré la clave o la cuenta docente"; exit 1; }
          docker exec cc-demo curl -s -c /tmp/d -o /tmp/login.html http://127.0.0.1:8080/login
          token=$(docker exec cc-demo grep -o 'name="_csrf" value="[^"]*"' /tmp/login.html | sed 's/.*value="//; s/"$//')
          docker exec cc-demo curl -s -b /tmp/d -c /tmp/d -o /dev/null --data-urlencode "_csrf=$token" \
            --data-urlencode "usuario=$docente" --data-urlencode "clave=$clave" http://127.0.0.1:8080/login
          docker exec cc-demo curl -s -b /tmp/d -o /tmp/academico.html http://127.0.0.1:8080/academico
          docker exec cc-demo grep -q "Mis secciones" /tmp/academico.html || { docker exec cc-demo cat /tmp/academico.html; exit 1; }
          docker exec cc-demo grep -q "3.° Primaria A" /tmp/academico.html
          docker exec cc-demo grep -q "Matemática" /tmp/academico.html
          seccion=$(docker exec cc-demo grep -o 'href="/academico/secciones/[0-9]*"' /tmp/academico.html | head -1 | sed 's/.*secciones\///; s/"$//')
          docker exec cc-demo curl -s -b /tmp/d -o /tmp/seccion.html "http://127.0.0.1:8080/academico/secciones/$seccion"
          docker exec cc-demo grep -q "Alumnos" /tmp/seccion.html
          if docker exec cc-demo grep -q "S/ " /tmp/academico.html /tmp/seccion.html; then
            echo "ERROR: una pantalla del docente muestra montos"; exit 1
          fi
          test "$(docker exec cc-demo curl -s -b /tmp/d -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/caja)" = "403"
          test "$(docker exec cc-demo curl -s -b /tmp/d -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/alumnos)" = "403"
          echo "OK: el docente de la demo ve sus dos secciones y los nombres de sus alumnos, sin montos; caja y alumnos: 403"

      - name: "E20 y E21: con un secreto en el entorno, una base real o junto a prod, la demo NO arranca"
        run: |
          no_arranca() {
            # Si arrancara, «timeout» corta el cliente y el contenedor se borra igual (por su nombre).
            if timeout 180 docker run --rm --name cc-demo-no --network cc-demo-interna -e SPRING_PROFILES_ACTIVE="$1" \
                -e "$2" cuentas-claras:ci > demo-no.log 2>&1; then
              echo "ERROR: la demo arrancó con $1 y $2"; exit 1
            fi
            docker rm -f cc-demo-no > /dev/null 2>&1 || true
            grep -q "$3" demo-no.log || { cat demo-no.log; exit 1; }
            echo "OK: con $2 ($1) no arranca: $3"
          }
          no_arranca demo "NUBEFACT_TOKEN=un-token-real" "no lleva secretos"
          no_arranca demo "DB_URL=jdbc:mysql://10.0.0.5:3306/cuentasclaras" "no lleva secretos"
          no_arranca demo "SPRING_DATASOURCE_URL=jdbc:mysql://10.0.0.5:3306/cuentasclaras" "H2 en memoria"
          no_arranca demo "AUDITORIA_CLAVE_HMAC=una-clave-de-una-instalacion-real-0001" "no lleva secretos"
          no_arranca demo "CUENTASCLARAS_MENSAJERIA_WHATSAPP_PROVEEDOR=WHATSAPP_CLOUD" "proveedores son simulados"
          no_arranca demo,prod "CC_MARCA_NOMBRE=x" "no se combina"
          rm -f demo-no.log

      - name: Borrar el contenedor y la red de la demo
        if: always()
        run: |
          docker rm -f cc-demo cc-demo-no || true
          docker network rm cc-demo-interna || true

  mysql:
    name: Migraciones, permisos y arranque en MySQL 8
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # Claves SOLO para la base desechable de este job. Producción usa el gestor de secretos.
      CC_PRUEBA_MYSQL: "true"
      CC_MYSQL_URL: "jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&useSSL=false"
      CC_MYSQL_CLAVE_MIGRADOR: "migrador-solo-ci-1"
      CC_MYSQL_CLAVE_APP: "app-solo-ci-1"
      CC_MYSQL_CLAVE_SISTEMA: "sistema-solo-ci-1"
      CC_MYSQL_CLAVE_RESPALDO: "respaldo-solo-ci-1"
      MYSQL_ADMIN: "mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot-ci"
      # Sprint 8, tanda 1 (decisión 122): en prod el nombre comercial es obligatorio (VerificadorConfiguracion).
      CC_MARCA_NOMBRE: "Cuentas Claras CI"
      # Sprint 8, tanda 2 (decisión 118): la clave de los secretos de los conectores SOLO de este job (32 bytes en base64,
      # no es la de desarrollo). Las pruebas cifran con ella y prod arranca verificando que los descifra todos.
      CC_CLAVE_CONECTORES: "Y2ktY29uZWN0b3Jlcy1zb2xvLWRlbC1qb2ItbXlzcWw="
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Empaquetar la aplicación
        run: ./mvnw -B -q -DskipTests package

      - name: Crear la base, los usuarios cc_migrador, cc_app, cc_sistema y cc_respaldo y el rol cc_negocio
        run: |
          sed -e "s/__CLAVE_MIGRADOR__/${CC_MYSQL_CLAVE_MIGRADOR}/" \
              -e "s/__CLAVE_APP__/${CC_MYSQL_CLAVE_APP}/" \
              -e "s/__CLAVE_SISTEMA__/${CC_MYSQL_CLAVE_SISTEMA}/" \
              -e "s/__CLAVE_RESPALDO__/${CC_MYSQL_CLAVE_RESPALDO}/" \
              scripts/mysql/01-usuarios.sql | $MYSQL_ADMIN

      - name: Migrar con cc_migrador (modo migrar, sin servidor web)
        env:
          DB_URL: ${{ env.CC_MYSQL_URL }}
          DB_MIGRADOR_USUARIO: cc_migrador
          DB_MIGRADOR_CLAVE: ${{ env.CC_MYSQL_CLAVE_MIGRADOR }}
        run: java -jar target/cuentas-claras-*.jar migrar

      - name: "Fase 1 (V1–V34): Hibernate valida el esquema con cc_app y cc_sistema y no faltan migraciones"
        run: ./mvnw -B test -Dtest=MigracionMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "Permisos de cc_app, cc_sistema y cc_respaldo (02 empieza con REVOKE ALL: es la fuente única)"
        run: |
          # Un GRANT dado a mano antes de 02 no sobrevive (H6): 02 lo quita todo y vuelve a dar solo lo suyo.
          $MYSQL_ADMIN -e "GRANT DELETE ON cuentasclaras.pago TO 'cc_app'@'%'"
          $MYSQL_ADMIN < scripts/mysql/02-permisos-tablas.sql
          if $MYSQL_ADMIN -N -e "SHOW GRANTS FOR 'cc_app'@'%'" | grep -q "DELETE ON \`cuentasclaras\`.\`pago\`"; then
            echo "ERROR: el GRANT dado a mano sobrevivió a 02-permisos-tablas.sql"; exit 1
          fi
          echo "OK: 02 quitó el GRANT dado a mano"

      - name: Triggers con cc_migrador (03-triggers.sql)
        run: |
          # Una sola vez por servidor (como administrador): el binlog está activo.
          $MYSQL_ADMIN -e "SET PERSIST log_bin_trust_function_creators = 1"
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_migrador -p"${CC_MYSQL_CLAVE_MIGRADOR}" cuentasclaras \
            < scripts/mysql/03-triggers.sql

      - name: "Sprint 5, tanda 2: un segundo colegio (con año en curso) para la renovación de matrícula"
        run: |
          # cc_app no crea colegios: aquí lo hace el administrador (nombre en ASCII: el cliente mysql no siempre envía
          # UTF-8). Sprint 8, tanda 1: nace en preparación, como el colegio 1 de una base nueva; las pruebas los ponen en
          # marcha por el alta (operador, firma, primera Promotoría, Dirección, Caja y paso a producción: CuentasDePrueba).
          $MYSQL_ADMIN cuentasclaras -e "INSERT INTO colegio (nombre) VALUES ('Colegio de renovacion CI')"

      - name: "Fase 2: la aplicación funciona con los permisos mínimos de cc_app"
        run: ./mvnw -B test -Dtest=PermisosMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "Sprint 8: alta de colegios por el operador; cc_app y cc_sistema no crean colegios ni Promotorías, no cobran en preparación ni cambian el estado (E3, E5 a E7, E9 a E11, E16, E29 y E30); los conectores entran en vigencia solo con la aprobación firmada de otra persona y no se editan (E12 y E14); «faltan filas» por colegio con cc_respaldo (E25)"
        run: ./mvnw -B test -Dtest=AuditoriaSprint8MySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "Sprint 9, tanda 1: una asignación docente no nace vigente ni se aprueba sin la firma de otra persona de Dirección (nunca el docente), no se termina sin firma, no cambia ni apunta a otro colegio; DOCENTE no se combina con CAJA ni ADMINISTRACION (E3, E4, E43 y E46)"
        run: ./mvnw -B test -Dtest=AuditoriaSprint9MySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "Sprint 9, tanda 2: la asistencia la registra solo el docente asignado, hoy según la base, con su sesión y su firma; no se edita, no se borra ni se bifurca; el personal no justifica; la corrección del día cierra al segundo aviso; la configuración solo Dirección con firma; los avisos sin cobranza y con consentimiento (E1, E2, E7 a E10, E12, E13, E15, E37, E40, E49 a E56, A12)"
        run: ./mvnw -B test -Dtest=AuditoriaSprint9AsistenciaMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "Sprint 9, tanda 3: un comunicado lo envía una persona con su rol real, su sesión y su firma; no se edita ni se borra; la huella la recalcula la base; sin caracteres invisibles ni cobranza; el PDF que requiere revisión lo aprueba el otro órgano; la fe de erratas llega a todos los del original; la familia confirma con su sesión; la nómina, Dirección con su sesión (E16 a E24, E28, E29, E37, E40, E43, E45, B1 a B4, B6, B7, B9, B13 a B15)"
        run: ./mvnw -B test -Dtest=AuditoriaSprint9ComunicadosMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "Correcciones del sprint 6: los ataques de la auditoría fallan en MySQL (después de la fase 2, que deja la foto de hoy)"
        run: ./mvnw -B test -Dtest=AuditoriaSprint6MySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "Sprint 7, tanda 2: con la clave de cc_app no se crea una cuenta, no se firma como sistema ni se aprueba a nombre de otra persona (E1 a E18)"
        run: ./mvnw -B test -Dtest=AuditoriaSprint7MySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "QA del sprint 7: firmas de sesiones vencidas, cerradas o de otra persona, y sesiones que no se reabren"
        run: ./mvnw -B test -Dtest=QaSprint7MySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "Correcciones del sprint 7 (S7-A1): con cc_app ya no se anula un pago sin la aprobación firmada (1644)"
        run: ./mvnw -B test -Dtest=AuditoriaAnulacionPagoMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "Correcciones del sprint 7: estado de las cuentas de Promotoría o Dirección y operaciones de dinero atadas a su solicitud firmada"
        run: ./mvnw -B test -Dtest=CorreccionesSprint7MySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "Correcciones del sprint 7 (S7-M1): un rol anidado en cc_negocio no se ve en SHOW GRANTS: el verificador lo detecta y 02 lo quita"
        run: |
          $MYSQL_ADMIN -e "CREATE ROLE 'cc_rol_oculto'; GRANT DELETE ON cuentasclaras.acceso_dato_personal TO 'cc_rol_oculto'; GRANT 'cc_rol_oculto' TO 'cc_negocio'"
          CC_PRUEBA_ROL_ANIDADO=presente ./mvnw -B test -Dtest=RolAnidadoMySqlTest -Dsurefire.failIfNoSpecifiedTests=false
          $MYSQL_ADMIN < scripts/mysql/02-permisos-tablas.sql
          aristas=$($MYSQL_ADMIN -N -e "SELECT COUNT(*) FROM mysql.role_edges WHERE TO_USER = 'cc_negocio'")
          [ "$aristas" = "0" ] || { echo "ERROR: 02 no quitó el rol anidado en cc_negocio"; exit 1; }
          CC_PRUEBA_ROL_ANIDADO=ausente ./mvnw -B test -Dtest=RolAnidadoMySqlTest -Dsurefire.failIfNoSpecifiedTests=false
          $MYSQL_ADMIN -e "DROP ROLE 'cc_rol_oculto'"
          echo "OK (S7-M1): el verificador ve el rol anidado y 02 lo quita al recrear cc_negocio"

      - name: "Fase 2b (sprint 5): con la mensajería simulada habilitada por el DBA, los mensajes y enlaces salen"
        run: |
