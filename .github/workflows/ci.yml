          conector_vigente="INSERT INTO conector_colegio (colegio_id, tipo, proveedor, modo, configuracion, clave_publica, estado, vigente, propuesto_por, resuelto_por, resuelto_en, prueba_ok, creado_en, creado_por, actualizado_en) VALUES (0, 'CUENTA_BANCARIA', 'BCP', 'REAL', '{}', '00000000-0000-4000-8000-000000000000', 'VIGENTE', TRUE, 'ci', 'ci.otro', NOW(6), TRUE, NOW(6), 'ci', NOW(6))"
          comprobar 1142 "DELETE FROM conector_colegio WHERE 1 = 0"
          for columna in secreto_cifrado configuracion propuesto_por clave_publica tipo proveedor modo clave_version; do
            comprobar 1143 "UPDATE conector_colegio SET $columna = $columna WHERE 1 = 0"
          done
          comprobar 1644 "$conector_vigente"
          comprobar_sistema 1644 "$conector_vigente"
          comprobar_sistema 1142 "DELETE FROM conector_colegio WHERE 1 = 0"
          comprobar_sistema 1143 "UPDATE conector_colegio SET secreto_cifrado = secreto_cifrado WHERE 1 = 0"
          # Correcciones del sprint 8 (V31). S8-A1 y S8-A2: el cambio del contacto del titular y el del correo de control
          # solo los escribe cc_sistema (1142 con cc_app), con la firma de un operador activo (1644 sin ella), no se borran
          # (1142) y lo propuesto no cambia (1143). S8-M2: una orden de pago en línea del colegio 0 (que no está en
          # producción) la rechaza trg_orden_pago_nace (1644); QA-S8-4: un mensaje a una familia del colegio 0, trg_mensaje_nace.
          cambio_contacto="INSERT INTO cambio_contacto_titular (colegio_id, usuario_id, telefono_nuevo, motivo, estado, pendiente, propuesto_por, operador_id, plataforma_id, creado_en, creado_por, actualizado_en) VALUES (0, 0, '+51999999999', 'ci de permisos', 'PROPUESTO', TRUE, 'ci', 0, 0, NOW(6), 'ci', NOW(6))"
          cambio_correo="INSERT INTO cambio_correo_control (colegio_id, correo_nuevo, motivo, estado, pendiente, propuesto_por, operador_id, plataforma_id, creado_en, creado_por, actualizado_en) VALUES (0, 'ci@x.pe', 'ci de permisos', 'PROPUESTO', TRUE, 'ci', 0, 0, NOW(6), 'ci', NOW(6))"
          comprobar 1142 "$cambio_contacto"
          comprobar 1142 "$cambio_correo"
          comprobar_sistema 1644 "$cambio_contacto"
          comprobar_sistema 1644 "$cambio_correo"
          comprobar_sistema 1142 "DELETE FROM cambio_contacto_titular WHERE 1 = 0"
          comprobar_sistema 1142 "DELETE FROM cambio_correo_control WHERE 1 = 0"
          comprobar_sistema 1143 "UPDATE cambio_contacto_titular SET telefono_nuevo = telefono_nuevo WHERE 1 = 0"
          comprobar_sistema 1143 "UPDATE cambio_correo_control SET correo_nuevo = correo_nuevo WHERE 1 = 0"
          comprobar 1644 "INSERT INTO orden_pago (colegio_id, referencia, familia_id, apoderado_id, proveedor, monto, moneda, comprobante_tipo, clave_idempotencia, vence_en, estado, creado_en, creado_por, actualizado_en) VALUES (0, 'ci', 0, 0, 'CULQI', 1, 'PEN', 'BOLETA', 'ci-preparacion', NOW(6), 'CREADA', NOW(6), 'ci', NOW(6))"
          comprobar 1644 "INSERT INTO mensaje (colegio_id, clave, tipo, canal, destinatario_tipo, destino, plantilla, parametros, estado, creado_en, creado_por, actualizado_en) VALUES (0, 'ci-familia', 'PAGO_REGISTRADO', 'CORREO', 'APODERADO', 'x@y.pe', 'PAGO_REGISTRADO', '', 'PENDIENTE', NOW(6), 'ci', NOW(6))"
          # Sprint 9, tanda 1 (V32, E4 y E46): una asignación docente no se borra (1142), no cambia de docente, sección, año,
          # tipo, áreas ni quién la propuso (1143) y no nace VIGENTE (trg_asignacion_docente_nace: 1644, con cc_app y con
          # cc_sistema); DOCENTE no se da junto a CAJA (trg_usuario_rol_alta: 1644, con cc_sistema).
          asignacion_vigente="INSERT INTO asignacion_docente (colegio_id, anio_escolar_id, seccion_id, usuario_id, tipo, estado, vigente, tutor_vigente, propuesto_por, resuelto_por, resuelto_en, creado_en, creado_por, actualizado_en) VALUES (0, 0, 0, 0, 'TUTOR', 'VIGENTE', TRUE, TRUE, 'ci', 'ci.otro', NOW(6), NOW(6), 'ci', NOW(6))"
          comprobar 1142 "DELETE FROM asignacion_docente WHERE 1 = 0"
          for columna in usuario_id seccion_id anio_escolar_id tipo areas propuesto_por; do
            comprobar 1143 "UPDATE asignacion_docente SET $columna = $columna WHERE 1 = 0"
          done
          comprobar 1644 "$asignacion_vigente"
          comprobar_sistema 1644 "$asignacion_vigente"
          comprobar_sistema 1142 "DELETE FROM asignacion_docente WHERE 1 = 0"
          cajera=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_app -p"${CC_MYSQL_CLAVE_APP}" cuentasclaras -N -e "SELECT MIN(u.id) FROM usuario u JOIN usuario_rol r ON r.usuario_id = u.id WHERE r.rol = 'CAJA'")
          comprobar_sistema 1644 "INSERT INTO usuario_rol (usuario_id, rol) VALUES (${cajera}, 'DOCENTE')"
          # Exactamente un colegio PLATAFORMA y, en él, solo operadores.
          plataformas=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_app -p"${CC_MYSQL_CLAVE_APP}" cuentasclaras -N -e "SELECT COUNT(*) FROM colegio WHERE tipo = 'PLATAFORMA'")
          [ "$plataformas" = "1" ] || { echo "ERROR: hay $plataformas colegios PLATAFORMA"; exit 1; }
          # Sprint 9, tanda 2 (V33, E7, E1, E55, E40, A2): la asistencia y el consentimiento son de solo inserción (1142);
          # la cobertura no se alarga (hasta: 1143); la marca de agua de los avisos la escribe solo cc_sistema (1142 con cc_app;
          # 1143 y 1142 con cc_sistema); un registro «del día» de ayer del colegio 0, una configuración académica sin
          # Dirección ni firma (1644) y, con cc_sistema, un aviso de asistencia con un monto (1644).
          for tabla in registro_asistencia marca_asistencia consentimiento_aviso; do
            comprobar 1142 "UPDATE $tabla SET version = version WHERE 1 = 0"
            comprobar 1142 "DELETE FROM $tabla WHERE 1 = 0"
          done
          comprobar 1143 "UPDATE asignacion_docente SET hasta = hasta WHERE 1 = 0"
          comprobar 1142 "INSERT INTO aviso_asistencia_corte (colegio_id, ultima_marca_id, creado_en, creado_por, actualizado_en) VALUES (0, 0, NOW(6), 'sistema.asistencia', NOW(6))"
          comprobar 1142 "UPDATE aviso_asistencia_corte SET ultima_marca_id = ultima_marca_id WHERE 1 = 0"
          comprobar_sistema 1143 "UPDATE aviso_asistencia_corte SET colegio_id = colegio_id WHERE 1 = 0"
          comprobar_sistema 1142 "DELETE FROM aviso_asistencia_corte WHERE 1 = 0"
          comprobar 1644 "INSERT INTO registro_asistencia (colegio_id, anio_escolar_id, seccion_id, fecha, origen, fuente, registrado_por, sesion_id, alumnos, creado_en, creado_por, actualizado_en) VALUES (0, 0, 0, DATE(UTC_TIMESTAMP() - INTERVAL 29 HOUR), 'DEL_DIA', 'DOCENTE', 'ci', 0, 0, NOW(6), 'ci', NOW(6))"
          comprobar 1644 "INSERT INTO configuracion_academica (colegio_id, actualizado_por, creado_en, creado_por, actualizado_en) VALUES (0, 'ci', NOW(6), 'ci', NOW(6))"
          comprobar_sistema 1644 "INSERT INTO mensaje (colegio_id, clave, tipo, canal, destinatario_tipo, familia_id, apoderado_id, destino, plantilla, parametros, estado, creado_en, creado_por, actualizado_en) VALUES (0, 'ci-asistencia', 'ASISTENCIA_DIA', 'CORREO', 'APODERADO', 0, 0, 'x@y.pe', 'cc_asistencia_v2', 'Mateo: falta. Debe S/ 350.00', 'PENDIENTE', NOW(6), 'sistema.asistencia', NOW(6))"
          # Sprint 9, tanda 3 (V34, E19, E28, E40, E45, B14): el adjunto, la confirmación y la nómina son de solo inserción
          # (1142); nada de comunicados se borra (1142); un comunicado enviado no se edita (1143); un comunicado de
          # Dirección del colegio 0 y una nómina sin sesión (1644) y, con cc_sistema, un resumen con un monto (1644).
          for tabla in comunicado_adjunto confirmacion_lectura exportacion_nomina; do
            comprobar 1142 "UPDATE $tabla SET version = version WHERE 1 = 0"
          done
          for tabla in comunicado comunicado_adjunto comunicado_destinatario confirmacion_lectura exportacion_nomina codigo_modular; do
            comprobar 1142 "DELETE FROM $tabla WHERE 1 = 0"
          done
          for columna in titulo cuerpo adjunto_id huella_contenido emisor_rol alcance; do
            comprobar 1143 "UPDATE comunicado SET $columna = $columna WHERE 1 = 0"
          done
          comprobar 1143 "UPDATE comunicado_destinatario SET familia_id = familia_id WHERE 1 = 0"
          comprobar 1644 "INSERT INTO comunicado (colegio_id, anio_escolar_id, tipo, emisor_usuario_id, emisor_rol, emisor_etiqueta, alcance, titulo, cuerpo, huella_contenido, estado, enviado_en, sesion_id, creado_en, creado_por, actualizado_en) VALUES (0, 0, 'NORMAL', 0, 'DIRECCION', 'ci', 'COLEGIO', 'Comunicado ci', 'Comunicado del CI', REPEAT('0', 64), 'ENVIADO', NOW(6), 0, NOW(6), 'ci', NOW(6))"
          comprobar 1644 "INSERT INTO exportacion_nomina (colegio_id, anio_escolar_id, seccion_id, perfil, filas, faltantes, codigo, sha256, sesion_id, creado_en, creado_por, actualizado_en) VALUES (0, 0, 0, 'SIAGIE_MATRICULA_PROVISIONAL', 0, 0, 'CI-0001', REPEAT('0', 64), 0, NOW(6), 'ci', NOW(6))"
          comprobar_sistema 1644 "INSERT INTO mensaje (colegio_id, clave, tipo, canal, destinatario_tipo, familia_id, apoderado_id, destino, plantilla, parametros, estado, creado_en, creado_por, actualizado_en) VALUES (0, 'ci-comunicados', 'COMUNICADOS_RESUMEN', 'CORREO', 'APODERADO', 0, 0, 'x@y.pe', 'cc_comunicados_v2', 'Colegio ci\n2 comunicados. Debe S/ 350.00', 'PENDIENTE', NOW(6), 'sistema.comunicados', NOW(6))"
          # Huellas (H7): cc_app ve las de los 98 triggers y las 13 funciones con huellas_objetos() (sprint 9, tanda 3).
          objetos=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_app -p"${CC_MYSQL_CLAVE_APP}" cuentasclaras -N -e "SELECT JSON_LENGTH(huellas_objetos())")
          [ "$objetos" = "$((esperados + 13))" ] || { echo "ERROR: huellas_objetos() devuelve $objetos objetos"; exit 1; }
          [ "$objetos" = "111" ] || { echo "ERROR: huellas_objetos() devuelve $objetos objetos y la tanda 3 del sprint 9 deja 111"; exit 1; }
          [ "$esperados" = "98" ] || { echo "ERROR: 03-triggers.sql tiene $esperados triggers y la tanda 3 del sprint 9 deja 98"; exit 1; }
          echo "OK: huellas_objetos() devuelve $objetos objetos (triggers y funciones)"

      - name: Arranque real en prod con cc_app y cc_sistema, por TLS (y rechazo con cc_migrador, sin TLS o con un privilegio de más)
        env:
          SPRING_PROFILES_ACTIVE: prod
          # Sprint 7, tanda 2 (H11): en prod la conexión va cifrada (el MySQL del contenedor trae su certificado).
          DB_URL: "jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&sslMode=REQUIRED"
          DB_SISTEMA_USUARIO: cc_sistema
          DB_SISTEMA_CLAVE: ${{ env.CC_MYSQL_CLAVE_SISTEMA }}
          AUDITORIA_CLAVE_HMAC: "clave-hmac-del-job-de-integracion-continua-0001"
          # Sprint 5 (decisión 40): prod no arranca sin un canal real para avisar a las familias. Correo SMTP (no se
          # conecta al arrancar; la salud no depende del correo).
          MENSAJERIA_CORREO_PROVEEDOR: SMTP
          CORREO_REMITENTE: "avisos@ci.cuentasclaras.pe"
          SPRING_MAIL_HOST: "127.0.0.1"
          # Sprint 8, tanda 1 (decisión 112): el operador de la plataforma sale del despliegue (sin clave en el entorno).
          CC_OPERADORES: "operador.ci:operador.ci@ci.cuentasclaras.pe"
        run: |
          DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" \
            java -jar target/cuentas-claras-*.jar --server.port=18080 > prod.log 2>&1 &
          PID_APP=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18080/actuator/health | grep -q UP && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18080/actuator/health | grep -q UP || { cat prod.log; exit 1; }
          grep -q "Permisos de la bitácora verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos de las cuotas verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos por columna y triggers de planes, lotes y solicitudes verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de caja, comprobantes, anulaciones, descuentos y cierres verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de pagos en línea, recaudación, conciliación y outbox del OSE verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de mensajería, acceso directo al titular y huella diaria verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de la renovación de matrícula, la matrícula reservada y los avisos de las familias" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de feriados, semilla del muestreo y cierre bancario mensual verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de la verificación de contactos, la huella por hora y los feriados aprobados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers del panel (resumen diario, alertas a Promotoría, contacto del personal y llamadas de control) verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos y triggers de las correcciones del sprint 6 (muestra congelada, delegación de las llamadas, texto del resumen y correo externo por colegio) verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Permisos del respaldo verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Triggers verificados: están los" prod.log || { cat prod.log; exit 1; }
          # Sprint 7, tanda 2 (sección 6.5).
          grep -q "Conexiones verificadas: las personas con cc_app y los procesos y la identidad con cc_sistema" prod.log || { cat prod.log; exit 1; }
          grep -q "Identidad, sesiones y firmas verificadas: cc_app no crea cuentas ni firma como sistema" prod.log || { cat prod.log; exit 1; }
          grep -q "Huellas de los 98 triggers y las 13 funciones verificadas" prod.log || { cat prod.log; exit 1; }
          # Sprint 8, tanda 2 (sección 3.6): los conectores (GRANT por columna y triggers) y la clave que descifra todos
          # sus secretos (los que dejaron las pruebas, cifrados con CC_CLAVE_CONECTORES).
          grep -q "Permisos y triggers de los conectores por colegio verificados" prod.log || { cat prod.log; exit 1; }
          grep -q "Secretos de los conectores verificados: " prod.log || { cat prod.log; exit 1; }
          # Sprint 8, tanda 1 (sección 6.4): un solo colegio PLATAFORMA, solo con operadores; el de CC_OPERADORES existe.
          grep -q "Plataforma verificada: " prod.log || { cat prod.log; exit 1; }
          grep -q "Operadores de la plataforma sincronizados: 1 en la lista" prod.log || { cat prod.log; exit 1; }
          activo=$($MYSQL_ADMIN cuentasclaras -N -e "SELECT COUNT(*) FROM usuario u JOIN colegio c ON c.id = u.colegio_id JOIN usuario_rol r ON r.usuario_id = u.id WHERE u.nombre_usuario = 'operador.ci' AND u.activo AND c.tipo = 'PLATAFORMA' AND r.rol = 'OPERADOR_PLATAFORMA'")
          [ "$activo" = "1" ] || { echo "ERROR: el operador de CC_OPERADORES no quedó activo en la plataforma"; exit 1; }
          grep -q "Privilegios verificados: cc_app y cc_sistema tienen solo los de 02-permisos-tablas.sql, sin roles anidados" prod.log || { cat prod.log; exit 1; }
          grep -q "Conexiones a MySQL cifradas (TLS) verificadas" prod.log || { cat prod.log; exit 1; }
          # Sprint 7, tanda 3 (V26, Ley 29733).
          grep -q "Permisos de la Ley 29733 verificados" prod.log || { cat prod.log; exit 1; }
          # Sprint 7: en prod el log es JSON (ECS) y las sondas de vida y de disponibilidad son públicas.
          grep -q '^{"@timestamp".*Triggers verificados' prod.log || { echo "ERROR: el log de prod no es JSON"; head -n 5 prod.log; exit 1; }

          curl -sf http://127.0.0.1:18080/actuator/health/liveness | grep -q UP || { cat prod.log; exit 1; }
          curl -sf http://127.0.0.1:18080/actuator/health/readiness | grep -q UP || { cat prod.log; exit 1; }
          curl -sf http://127.0.0.1:18080/salud/respaldo | grep -qx "ATRASADO\|OK" || { echo "ERROR: /salud/respaldo"; exit 1; }

          # Sprint 7, tanda 3 (A02, A05, E22): cabeceras de seguridad y cookie __Host- del servidor real de prod.
          curl -s -D cabeceras.txt -o login.html http://127.0.0.1:18080/login
          for cabecera in "Strict-Transport-Security: max-age=31536000 ; includeSubDomains" \
              "Cross-Origin-Opener-Policy: same-origin" "Cross-Origin-Resource-Policy: same-origin" \
              "Content-Security-Policy: default-src 'self'" "X-Frame-Options: DENY" "X-Content-Type-Options: nosniff"; do
            grep -qi "^$cabecera" cabeceras.txt || { echo "ERROR: falta la cabecera $cabecera"; cat cabeceras.txt; exit 1; }
          done
          grep -i "^Set-Cookie: __Host-CCSESION=" cabeceras.txt | grep -qi "Path=/" || { cat cabeceras.txt; exit 1; }
          grep -i "^Set-Cookie: __Host-CCSESION=" cabeceras.txt | grep -i "Secure" | grep -qi "HttpOnly" \
            || { echo "ERROR: la cookie de sesión no es __Host- con Secure y HttpOnly"; cat cabeceras.txt; exit 1; }
          if grep -i "^Set-Cookie: __Host-CCSESION=" cabeceras.txt | grep -qi "Domain="; then
            echo "ERROR: una cookie __Host- no lleva dominio"; exit 1
          fi
          echo "OK: HSTS, COOP, CORP, CSP y la cookie __Host-CCSESION (Secure, HttpOnly, Path=/, sin dominio)"
          # Sprint 7, tanda 3 (H9, E24): 5 intentos fallidos con un usuario desde esta conexión y la 6.a espera (429, la
          # página de ingreso con el aviso), sin llegar a la cuenta. La cookie Secure se envía a mano (curl no la manda
          # por http).
          cookie=$(grep -i "^Set-Cookie: __Host-CCSESION=" cabeceras.txt | sed -e 's/^[^:]*: //' -e 's/;.*//' | tr -d '\r')
          token=$(grep -o 'name="_csrf" value="[^"]*"' login.html | sed 's/.*value="//; s/"$//')
          for i in 1 2 3 4 5; do
            estado=$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: $cookie" \
              --data-urlencode "usuario=nadie.ci" --data-urlencode "clave=no-es-la-clave" --data-urlencode "_csrf=$token" \
              http://127.0.0.1:18080/login)
            [ "$estado" = "302" ] || { echo "ERROR: el intento $i respondió $estado"; exit 1; }
          done
          estado=$(curl -s -o espera.html -w '%{http_code}' -H "Cookie: $cookie" \
            --data-urlencode "usuario=nadie.ci" --data-urlencode "clave=no-es-la-clave" --data-urlencode "_csrf=$token" \
            http://127.0.0.1:18080/login)
          [ "$estado" = "429" ] || { echo "ERROR: el 6.o intento respondió $estado (esperaba 429)"; exit 1; }
          grep -q "Demasiados intentos con este usuario desde esta conexi" espera.html \
            || { echo "ERROR: la página del 429 no trae el aviso"; cat espera.html; exit 1; }
          echo "OK: tras 5 intentos fallidos la conexión espera (429) sin bloquear la cuenta"

          kill "$PID_APP"
          if DB_USUARIO=cc_migrador DB_CLAVE="${CC_MYSQL_CLAVE_MIGRADOR}" timeout 120 \
               java -jar target/cuentas-claras-*.jar --server.port=18081 > prod-migrador.log 2>&1; then
            echo "ERROR: la aplicación arrancó con un usuario que puede editar la bitácora"; exit 1
          fi
          grep -q "PUEDE ejecutar" prod-migrador.log || { cat prod-migrador.log; exit 1; }
          echo "OK: arranca con cc_app y se niega con cc_migrador"
          # E9: sin TLS no arranca.
          if DB_URL="${CC_MYSQL_URL}" DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" timeout 120 \
               java -jar target/cuentas-claras-*.jar --server.port=18083 > prod-sin-tls.log 2>&1; then
            echo "ERROR: la aplicación arrancó en prod sin TLS"; exit 1
          fi
          grep -q "no va cifrada (TLS)" prod-sin-tls.log || { cat prod-sin-tls.log; exit 1; }
          # E9: el mismo usuario para las personas y los procesos no arranca.
          if DB_USUARIO=cc_sistema DB_CLAVE="${CC_MYSQL_CLAVE_SISTEMA}" timeout 120 \
               java -jar target/cuentas-claras-*.jar --server.port=18084 > prod-mismo-usuario.log 2>&1; then
            echo "ERROR: la aplicación arrancó con el mismo usuario en los dos pools"; exit 1
          fi
          grep -q "no pueden ser el mismo usuario" prod-mismo-usuario.log || { cat prod-mismo-usuario.log; exit 1; }
          # Sprint 8, tanda 2 (secciones 3.1 y 3.6): una instalación COMPARTIDA con el token de Nubefact en el entorno no
          # arranca (los secretos son de cada colegio, en sus conectores).
          if CC_INSTALACION=COMPARTIDA NUBEFACT_TOKEN="un-token-del-entorno" DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" \
               timeout 120 java -jar target/cuentas-claras-*.jar --server.port=18089 > prod-compartida-token.log 2>&1; then
            echo "ERROR: una instalación COMPARTIDA arrancó con NUBEFACT_TOKEN en el entorno"; exit 1
          fi
          grep -q "no lleva secretos de conectores" prod-compartida-token.log || { cat prod-compartida-token.log; exit 1; }
          # E9: un privilegio de más (TRIGGER sobre el esquema) no deja arrancar; 02 lo quita.
          $MYSQL_ADMIN -e "GRANT TRIGGER ON cuentasclaras.* TO 'cc_app'@'%'"
          if DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" timeout 120 \
               java -jar target/cuentas-claras-*.jar --server.port=18085 > prod-privilegio.log 2>&1; then
            echo "ERROR: la aplicación arrancó con un privilegio de más"; exit 1
          fi
          grep -q "tiene privilegios que 02-permisos-tablas.sql no da" prod-privilegio.log || { cat prod-privilegio.log; exit 1; }
          $MYSQL_ADMIN < scripts/mysql/02-permisos-tablas.sql
          echo "OK: sin TLS, con el mismo usuario o con un privilegio de más, prod no arranca"

      - name: "M2: prod no arranca si falta un trigger BEFORE UPDATE (y vuelve a arrancar al restaurarlo)"
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: "jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&sslMode=REQUIRED"
          DB_SISTEMA_USUARIO: cc_sistema
          DB_SISTEMA_CLAVE: ${{ env.CC_MYSQL_CLAVE_SISTEMA }}
          AUDITORIA_CLAVE_HMAC: "clave-hmac-del-job-de-integracion-continua-0001"
          MENSAJERIA_CORREO_PROVEEDOR: SMTP
          CORREO_REMITENTE: "avisos@ci.cuentasclaras.pe"
          SPRING_MAIL_HOST: "127.0.0.1"
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_migrador -p"${CC_MYSQL_CLAVE_MIGRADOR}" cuentasclaras \
            -e "DROP TRIGGER trg_mensaje_envio"
          if DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" timeout 120 \
               java -jar target/cuentas-claras-*.jar --server.port=18082 > prod-sin-trigger.log 2>&1; then
            echo "ERROR: la aplicación arrancó sin trg_mensaje_envio"; exit 1
          fi
          # Sprint 7, tanda 2: lo nombran primero las huellas («Faltan: …»); sin la función, la lista de triggers.
          grep -q "Faltan: trg_mensaje_envio\|Faltan triggers en la base: trg_mensaje_envio" prod-sin-trigger.log \
            || { cat prod-sin-trigger.log; exit 1; }
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_migrador -p"${CC_MYSQL_CLAVE_MIGRADOR}" cuentasclaras \
            < scripts/mysql/03-triggers.sql
          echo "OK: sin el trigger BEFORE UPDATE, prod no arranca; restaurado con 03-triggers.sql"

      - name: "M3 (E7 y E8): un trigger debilitado con el mismo nombre, una función reemplazada o un trigger de más no dejan arrancar prod"
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: "jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&sslMode=REQUIRED"
          DB_SISTEMA_USUARIO: cc_sistema
          DB_SISTEMA_CLAVE: ${{ env.CC_MYSQL_CLAVE_SISTEMA }}
          AUDITORIA_CLAVE_HMAC: "clave-hmac-del-job-de-integracion-continua-0001"
          MENSAJERIA_CORREO_PROVEEDOR: SMTP
          CORREO_REMITENTE: "avisos@ci.cuentasclaras.pe"
          SPRING_MAIL_HOST: "127.0.0.1"
          # El mismo operador que el arranque anterior (el paso M4 lo quita de la lista).
          CC_OPERADORES: "operador.ci:operador.ci@ci.cuentasclaras.pe"
        run: |
          migrador() {
            mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_migrador -p"${CC_MYSQL_CLAVE_MIGRADOR}" cuentasclaras "$@"
          }
          no_arranca() {
            caso="$1"; esperado="$2"
            if DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" timeout 120 \
                 java -jar target/cuentas-claras-*.jar --server.port=18086 > "prod-$caso.log" 2>&1; then
              echo "ERROR: la aplicación arrancó con $caso"; exit 1
            fi
            grep -q "$esperado" "prod-$caso.log" || { cat "prod-$caso.log"; exit 1; }
            echo "OK: con $caso, prod no arranca ($esperado)"
          }
          # 1. trg_usuario_rol_alta sin el bloque de Promotoría y Dirección (como el de antes del sprint 7).
          migrador <<'SQL'
          DELIMITER //
          DROP TRIGGER trg_usuario_rol_alta//
          CREATE TRIGGER trg_usuario_rol_alta BEFORE INSERT ON usuario_rol FOR EACH ROW
          BEGIN
              IF SUBSTRING_INDEX(SESSION_USER(), '@', 1) <> 'cc_sistema' THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'cuentasclaras: los roles los cambia solo cc_sistema';
              END IF;
          END//
          DELIMITER ;
          SQL
          no_arranca "trigger-debilitado" "huella distinta: trg_usuario_rol_alta"
          migrador < scripts/mysql/03-triggers.sql
          # 2. cc_es_sistema() reemplazada por una que siempre dice TRUE (cc_app firmaría como sistema).
          migrador -e "DROP FUNCTION cc_es_sistema; CREATE FUNCTION cc_es_sistema() RETURNS BOOLEAN NO SQL RETURN TRUE"
          no_arranca "funcion-reemplazada" "huella distinta: cc_es_sistema"
          migrador < scripts/mysql/03-triggers.sql
          # 3. Un trigger de más (que no está en 03-triggers.sql).
          migrador -e "CREATE TRIGGER trg_de_mas BEFORE INSERT ON colegio FOR EACH ROW SET NEW.nombre = NEW.nombre"
          no_arranca "trigger-de-mas" "Sobran (no están en 03-triggers.sql ni en 02): trg_de_mas"
          migrador -e "DROP TRIGGER trg_de_mas"
          # Restaurada, vuelve a arrancar.
          DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" java -jar target/cuentas-claras-*.jar --server.port=18087 > prod-restaurada.log 2>&1 &
          PID_APP=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18087/actuator/health | grep -q UP && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18087/actuator/health | grep -q UP || { cat prod-restaurada.log; exit 1; }
          kill "$PID_APP"
          echo "OK: restaurados 02 y 03, prod vuelve a arrancar"

      - name: "M4 (E8): un operador quitado de CC_OPERADORES queda inactivo y ya no crea colegios (1644)"
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: "jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&sslMode=REQUIRED"
          DB_SISTEMA_USUARIO: cc_sistema
          DB_SISTEMA_CLAVE: ${{ env.CC_MYSQL_CLAVE_SISTEMA }}
          AUDITORIA_CLAVE_HMAC: "clave-hmac-del-job-de-integracion-continua-0001"
          MENSAJERIA_CORREO_PROVEEDOR: SMTP
          CORREO_REMITENTE: "avisos@ci.cuentasclaras.pe"
          SPRING_MAIL_HOST: "127.0.0.1"
          CC_OPERADORES: "otro.operador.ci:otro.operador.ci@ci.cuentasclaras.pe"
        run: |
          # Antes (con operador.ci activo), cc_sistema SÍ crea un colegio en preparación a su nombre: el control de abajo
          # no es un falso positivo.
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_sistema -p"${CC_MYSQL_CLAVE_SISTEMA}" cuentasclaras \
            -e "INSERT INTO colegio (nombre, tipo, estado, activo, creado_por, actualizado_en) VALUES ('Colegio M4 antes', 'COLEGIO', 'PREPARACION', TRUE, 'operador.ci', NOW(6))"
          DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" java -jar target/cuentas-claras-*.jar --server.port=18088 > prod-m4.log 2>&1 &
          PID_APP=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18088/actuator/health | grep -q UP && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18088/actuator/health | grep -q UP || { cat prod-m4.log; exit 1; }
          kill "$PID_APP"
          grep -q "1 creados, 0 reactivados, 1 desactivados" prod-m4.log || { cat prod-m4.log; exit 1; }
          activo=$($MYSQL_ADMIN cuentasclaras -N -e "SELECT activo FROM usuario WHERE nombre_usuario = 'operador.ci'")
          [ "$activo" = "0" ] || { echo "ERROR: operador.ci sigue activo"; exit 1; }
          if salida=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_sistema -p"${CC_MYSQL_CLAVE_SISTEMA}" cuentasclaras \
              -e "INSERT INTO colegio (nombre, tipo, estado, activo, creado_por, actualizado_en) VALUES ('Colegio M4 despues', 'COLEGIO', 'PREPARACION', TRUE, 'operador.ci', NOW(6))" 2>&1); then
            echo "ERROR: un operador desactivado creó un colegio"; exit 1
          fi
          echo "$salida" | grep -q "ERROR 1644" || { echo "Error inesperado: $salida"; exit 1; }
          echo "OK (M4): quitado de CC_OPERADORES, operador.ci quedó inactivo y ya no crea colegios"

      - name: "Sprint 8, tanda 2 (decisión 118): rotación de la clave de los conectores con cc_migrador; prod arranca con la nueva y no con la anterior"
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: "jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&sslMode=REQUIRED"
          DB_SISTEMA_USUARIO: cc_sistema
          DB_SISTEMA_CLAVE: ${{ env.CC_MYSQL_CLAVE_SISTEMA }}
          AUDITORIA_CLAVE_HMAC: "clave-hmac-del-job-de-integracion-continua-0001"
          MENSAJERIA_CORREO_PROVEEDOR: SMTP
          CORREO_REMITENTE: "avisos@ci.cuentasclaras.pe"
          SPRING_MAIL_HOST: "127.0.0.1"
          CC_OPERADORES: "otro.operador.ci:otro.operador.ci@ci.cuentasclaras.pe"
          CLAVE_NUEVA: "Y2ktY29uZWN0b3Jlcy1yb3RhZGEtdjItZGVsLWpvYiE="
        run: |
          app() {
            mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_app -p"${CC_MYSQL_CLAVE_APP}" cuentasclaras -N -e "$1"
          }
          antes=$(app "SELECT COUNT(*) FROM conector_colegio WHERE secreto_cifrado IS NOT NULL AND clave_version = 1")
          [ "$antes" -ge 1 ] || { echo "ERROR: las pruebas no dejaron secretos de conectores para rotar"; exit 1; }
          # cc_migrador solo cambia el secreto y su versión (hacia arriba): ni el estado ni una versión menor (1644).
          for sql in "UPDATE conector_colegio SET estado = 'VIGENTE', vigente = TRUE WHERE secreto_cifrado IS NOT NULL AND estado = 'RECHAZADO'" \
                     "UPDATE conector_colegio SET clave_version = 0 WHERE secreto_cifrado IS NOT NULL"; do
            if salida=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_migrador -p"${CC_MYSQL_CLAVE_MIGRADOR}" cuentasclaras -e "$sql" 2>&1); then
              echo "ERROR: cc_migrador pudo ejecutar: $sql"; exit 1
            fi
            echo "$salida" | grep -q "ERROR 1644\|ERROR 3819" || { echo "Error inesperado: $salida"; exit 1; }
            echo "OK cc_migrador: $sql"
          done
          # Con cc_app, el secreto no cambia (1143) aunque alguien tenga la clave nueva.
          if salida=$(app "UPDATE conector_colegio SET clave_version = 2 WHERE 1 = 0" 2>&1); then
            echo "ERROR: cc_app pudo cambiar la versión de la clave"; exit 1
          fi
          echo "$salida" | grep -q "ERROR 1143" || { echo "Error inesperado: $salida"; exit 1; }
          # La rotación: con cc_migrador, la clave nueva (versión 2) y la anterior.
          DB_URL="${CC_MYSQL_URL}" DB_MIGRADOR_USUARIO=cc_migrador DB_MIGRADOR_CLAVE="${CC_MYSQL_CLAVE_MIGRADOR}" \
            CC_CLAVE_CONECTORES_ANTERIOR="${CC_CLAVE_CONECTORES}" CC_CLAVE_CONECTORES="${CLAVE_NUEVA}" \
            CC_CLAVE_CONECTORES_VERSION=2 java -jar target/cuentas-claras-*.jar recifrar-conectores > recifrar.log 2>&1 \
            || { cat recifrar.log; exit 1; }
          grep -q "Secretos de los conectores cifrados de nuevo: $antes de la versión 1 a la 2" recifrar.log || { cat recifrar.log; exit 1; }
          [ "$(app "SELECT COUNT(*) FROM conector_colegio WHERE secreto_cifrado IS NOT NULL AND clave_version = 1")" = "0" ] \
            || { echo "ERROR: quedaron secretos en la versión 1"; exit 1; }
          # Con la clave anterior (versión 1), prod no arranca: no descifra los secretos rotados.
          if DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" timeout 120 \
               java -jar target/cuentas-claras-*.jar --server.port=18090 > prod-clave-vieja.log 2>&1; then
            echo "ERROR: prod arrancó con la clave anterior de los conectores"; exit 1
          fi
          grep -q "no descifra $antes secreto" prod-clave-vieja.log || { cat prod-clave-vieja.log; exit 1; }
          # Con la nueva (versión 2), arranca y los verifica.
          CC_CLAVE_CONECTORES="${CLAVE_NUEVA}" CC_CLAVE_CONECTORES_VERSION=2 DB_USUARIO=cc_app DB_CLAVE="${CC_MYSQL_CLAVE_APP}" \
            java -jar target/cuentas-claras-*.jar --server.port=18091 > prod-clave-nueva.log 2>&1 &
          PID_APP=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18091/actuator/health | grep -q UP && break
            sleep 2
          done
          curl -sf http://127.0.0.1:18091/actuator/health | grep -q UP || { cat prod-clave-nueva.log; exit 1; }
          kill "$PID_APP"
          grep -q "Secretos de los conectores verificados: $antes con la clave versión 2" prod-clave-nueva.log || { cat prod-clave-nueva.log; exit 1; }
          echo "OK: rotación de la clave de los conectores con cc_migrador; prod arranca con la nueva y no con la anterior"

  respaldo:
    name: Respaldo cifrado, restauración real, ataques E29 a E32 y «faltan filas» por colegio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      # Segundo MySQL, VACÍO: ahí se restaura (como la máquina del simulacro semanal).
      restauracion:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root-restauracion-ci
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-restauracion-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # Claves SOLO para las bases desechables de este job.
      CC_PRUEBA_MYSQL: "true"
      CC_MYSQL_URL: "jdbc:mysql://127.0.0.1:3306/cuentasclaras?allowPublicKeyRetrieval=true&useSSL=false"
      CC_MYSQL_CLAVE_MIGRADOR: "migrador-solo-ci-2"
      CC_MYSQL_CLAVE_APP: "app-solo-ci-2"
      CC_MYSQL_CLAVE_SISTEMA: "sistema-solo-ci-2"
      CC_MYSQL_CLAVE_RESPALDO: "respaldo-solo-ci-2"
      MYSQL_ADMIN: "mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot-ci"
      CC_MARCA_NOMBRE: "Cuentas Claras CI"
      # El respaldo (scripts/respaldo/respaldar.sh) como en el servidor: cc_respaldo y dos destinatarios age.
      RESPALDO_DB_HOST: "127.0.0.1"
      RESPALDO_DB_PUERTO: "3306"
      RESPALDO_DB_USUARIO: "cc_respaldo"
      RESPALDO_DB_CLAVE: "respaldo-solo-ci-2"
      # Destino «real» del CI: un remoto de rclone cuyas credenciales llegan SOLO por variables (aquí, un alias a una
      # carpeta del runner en lugar del almacenamiento de objetos con bloqueo).
      RESPALDO_DESTINO: "cirespaldos"
      RCLONE_CONFIG_CIRESPALDOS_TYPE: "alias"
      RCLONE_CONFIG_CIRESPALDOS_REMOTE: "/tmp/cc-respaldos-ci"
      RCLONE_CONFIG_CIFORJADO_TYPE: "alias"
      RCLONE_CONFIG_CIFORJADO_REMOTE: "/tmp/cc-respaldos-forjados"
      # La restauración, en el segundo MySQL.
      RESTAURAR_DB_HOST: "127.0.0.1"
      RESTAURAR_DB_PUERTO: "3308"
      RESTAURAR_DB_ADMIN: "root"
      RESTAURAR_DB_ADMIN_CLAVE: "root-restauracion-ci"
      MYSQL_RESTAURACION: "mysql --protocol=TCP -h 127.0.0.1 -P 3308 -uroot -proot-restauracion-ci"
      # Sprint 8, tanda 2: la clave de los secretos de los conectores (la de este job); el arranque de prod sobre la copia
      # verifica que los descifra.
      CC_CLAVE_CONECTORES: "Y2ktY29uZWN0b3Jlcy1kZWwtam9iLXJlc3BhbGRvLTE="
      # La clave HMAC con la que las pruebas sellaron la bitácora (perfil test): la verificación recalcula toda la cadena.
      CLAVE_HMAC_PRUEBAS: "clave-hmac-de-pruebas-no-usar-en-produccion-0001"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Empaquetar la aplicación
        run: ./mvnw -B -q -DskipTests package

      - name: "age y rclone de los paquetes de Ubuntu (sin binarios de otras fuentes)"
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q age rclone
          age --version
          rclone version | head -n 1

      - name: Base de origen como la del job mysql (V1–V34, permisos y triggers)
        run: |
          sed -e "s/__CLAVE_MIGRADOR__/${CC_MYSQL_CLAVE_MIGRADOR}/" -e "s/__CLAVE_APP__/${CC_MYSQL_CLAVE_APP}/" \
              -e "s/__CLAVE_RESPALDO__/${CC_MYSQL_CLAVE_RESPALDO}/" -e "s/__CLAVE_SISTEMA__/${CC_MYSQL_CLAVE_SISTEMA}/" \
              scripts/mysql/01-usuarios.sql | $MYSQL_ADMIN
          DB_URL="$CC_MYSQL_URL" DB_MIGRADOR_USUARIO=cc_migrador DB_MIGRADOR_CLAVE="$CC_MYSQL_CLAVE_MIGRADOR" \
            java -jar target/cuentas-claras-*.jar migrar
          $MYSQL_ADMIN < scripts/mysql/02-permisos-tablas.sql
          $MYSQL_ADMIN -e "SET PERSIST log_bin_trust_function_creators = 1"
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -ucc_migrador -p"${CC_MYSQL_CLAVE_MIGRADOR}" cuentasclaras \
            < scripts/mysql/03-triggers.sql
          $MYSQL_ADMIN cuentasclaras -e "INSERT INTO colegio (nombre) VALUES ('Colegio de renovacion CI')"

      - name: "Datos de todas las pruebas de MySQL (fase 2: cobros, anulaciones, mensajes, bitácora...)"
        run: ./mvnw -B test -Dtest=PermisosMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Claves age desechables (Promotoría y responsable técnico)
        run: |
          mkdir -p /tmp/cc-claves && chmod 700 /tmp/cc-claves
          age-keygen -o /tmp/cc-claves/promotoria.txt 2>/dev/null
          age-keygen -o /tmp/cc-claves/responsable.txt 2>/dev/null
          echo "RESPALDO_AGE_DESTINATARIOS=$(age-keygen -y /tmp/cc-claves/promotoria.txt) $(age-keygen -y /tmp/cc-claves/responsable.txt)" >> "$GITHUB_ENV"
          echo "RESTAURAR_AGE_IDENTIDAD=/tmp/cc-claves/responsable.txt" >> "$GITHUB_ENV"

      - name: "Sin credenciales del destino o con un solo destinatario, el respaldo no empieza"
        run: sh scripts/respaldo/pruebas-ci.sh sin-credenciales

      - name: "Respaldo 1: volcado cifrado al destino, manifiesto y registro como cc_respaldo"
        run: sh scripts/respaldo/pruebas-ci.sh primer-respaldo

      - name: "E29: el respaldo robado no se puede leer (ningún DNI ni apellido de la base en el .age)"
        run: sh scripts/respaldo/pruebas-ci.sh e29

      - name: "Restauración real en el segundo MySQL: verifica la cadena HMAC, los libros y arranca prod sobre la copia"
        run: sh scripts/respaldo/pruebas-ci.sh restauracion

      - name: "E31: un respaldo alterado (un evento cambiado y vuelto a cifrar, con su manifiesto) no verifica"
        run: sh scripts/respaldo/pruebas-ci.sh e31

      - name: "E30: un DBA borra un pago después del respaldo: el respaldo siguiente avisa «faltan filas»"
        run: sh scripts/respaldo/pruebas-ci.sh e30

      - name: "E32: un DBA recorta el final de la bitácora (y el eslabón): el respaldo siguiente avisa por el ancla"
        run: sh scripts/respaldo/pruebas-ci.sh e32

      - name: "QA-S7-1: un segundo respaldo NO borra la alerta «faltan filas» (y la base rechaza IGUAL mientras no se resuelva)"
        run: sh scripts/respaldo/pruebas-ci.sh faltan-filas-sigue

      - name: "Simulacro semanal (sin la clave HMAC) del último respaldo: detecta el recorte y el pago borrado"
        run: sh scripts/respaldo/pruebas-ci.sh restauracion-sin-clave

      - name: "S7-M1: el simulacro semanal relee los GRANT de prod (un rol anidado en cc_negocio aparece) y 02 lo quita"
        run: sh scripts/respaldo/pruebas-ci.sh permisos-anidados

      - name: "QA-S7-1: Promotoría resuelve la alerta con motivo y su firma (sin firma o sin Promotoría, 1644)"
        run: CC_PRUEBA_RESOLUCION_RESPALDO=true ./mvnw -B test -Dtest=ResolucionRespaldoMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "QA-S7-1: resuelta, el respaldo siguiente vuelve a IGUAL"
        run: sh scripts/respaldo/pruebas-ci.sh resuelto

      - name: "Sprint 8, tanda 3 (E25 y E28): un DBA borra un pago de UN colegio: el respaldo avisa solo a ese colegio"
        run: sh scripts/respaldo/pruebas-ci.sh faltan-filas-por-colegio

      - name: "Sprint 8, tanda 3 (E25): la Promotoría de otro colegio no la resuelve (1644) y la del colegio afectado sí"
        run: CC_PRUEBA_RESOLUCION_POR_COLEGIO=true ./mvnw -B test -Dtest=ResolucionRespaldoPorColegioMySqlTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: "Sprint 8, tanda 3: resuelta por su colegio, el respaldo siguiente vuelve a IGUAL"
        run: sh scripts/respaldo/pruebas-ci.sh resuelto-por-colegio

      - name: "Destino simulado: solo con la fila del DBA (nunca en prod); sin ella, la base no lo registra (1644)"
        run: sh scripts/respaldo/pruebas-ci.sh simulado

      - name: "Sprint 9, tanda 2 (H13): un DBA borra una marca de asistencia de UN colegio: el respaldo avisa «faltan filas» solo a ese colegio"
        run: sh scripts/respaldo/pruebas-ci.sh faltan-filas-asistencia

  imagen:
    name: Imagen en GHCR por el SHA del commit, con su SBOM (solo main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verificar, dependencias, secretos, demo, mysql, respaldo]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sprint 8, tanda 3 (decisión 134): la imagen se construye UNA vez aquí y se despliega por su digest (nunca
      # «latest»). La etiqueta es el SHA del commit; el SBOM y la procedencia van como atestaciones de la imagen.
      - name: Construir y publicar en GHCR (etiqueta = SHA del commit) con SBOM y procedencia
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          imagen="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --name cc-constructor > /dev/null
          docker buildx build --push --sbom=true --provenance=mode=max \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$imagen:$GITHUB_SHA" .
          digest=$(docker buildx imagetools inspect "$imagen:$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "Imagen para desplegar: $imagen@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
